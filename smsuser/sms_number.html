<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMSGLOBE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBlue: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
              dashboard: '#0284c7',
              panel: '#0369a1',
              bgLight: '#f8fafc'
            }
          }
        }
      }
    }

<body class="bg-[#f8fafc] min-h-screen text-gray-800 font-sans antialiased">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <div class="flex items-center space-x-8">
          <div class="flex items-center space-x-2">
            <a href="#" class="flex items-center">
              <img src="/assets/logo.png" alt="SMSGLOBE Logo" class="h-9 w-auto object-contain">
            </a>
          </div>
        </div>

        <div class="flex items-center space-x-3 sm:space-x-4">
          <button class="hidden sm:inline-flex items-center px-3 py-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold rounded-md transition">
            EN <i class="fa-solid fa-chevron-down ml-1 text-[10px]"></i>
          </button>

          <div class="bg-brandBlue-50 text-brandBlue-800 text-xs sm:text-sm font-semibold px-3 py-2 rounded-lg border border-brandBlue-100 flex items-center space-x-2">
            <span>Balance: <span id="displayBalance" class="font-bold">Loading...</span></span>
            <span id="displayBonusContainer" class="hidden text-xs text-emerald-600 font-medium">(Bonus: <span id="displayBonus">₦0</span>)</span>
          </div>

          <div id="userAvatar" class="w-9 h-9 bg-gray-200 rounded-full flex items-center justify-center text-gray-600 font-bold cursor-pointer hover:bg-gray-300 transition">
            <i class="fa-solid fa-user"></i>
          </div>

          <button id="mobile-menu-btn" class="md:hidden text-gray-600 hover:text-gray-900 focus:outline-none">
            <i class="fa-solid fa-bars text-xl"></i>
          </button>
        </div>
      </div>
    </div>

    <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-100 px-4 pt-2 pb-4 space-y-2">
      <a href="#" class="block py-2 text-gray-600 hover:text-brandBlue-700 font-medium">Histories</a>
      <a href="#" class="block py-2 text-gray-600 hover:text-brandBlue-700 font-medium">Statistic</a>
      <a href="#" class="block py-2 text-gray-600 hover:text-brandBlue-700 font-medium">Set up max/min price</a>
      <a href="#" class="block py-2 text-gray-600 hover:text-brandBlue-700 font-medium">Purchase of email</a>
      <a href="#" class="block py-2 text-gray-600 hover:text-brandBlue-700 font-medium">More</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <div class="lg:col-span-4 space-y-5">
        
        <div class="bg-brandBlue-900 p-1.5 rounded-xl flex shadow-sm">
          <button class="flex-1 bg-brandBlue-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow text-center transition">
            Numbers
          </button>
          <button class="flex-1 text-gray-300 hover:text-white font-medium py-2.5 rounded-lg text-sm text-center transition">
            HISTORY
          </button>
        </div>

        <div class="bg-brandBlue-800 rounded-2xl p-5 text-white shadow-md relative">
          <div class="flex items-center space-x-3 mb-3">
            <span class="w-6 h-6 rounded-full bg-brandBlue-600 text-white text-xs font-bold flex items-center justify-center border border-brandBlue-500">1</span>
            <span class="font-semibold text-sm tracking-wide">Select service</span>
          </div>

          <div class="relative mb-4">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400">
              <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </span>
            <input type="text" id="service-search-input" placeholder="Select service" class="w-full bg-brandBlue-900/60 text-white placeholder-gray-400 text-sm rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brandBlue-500 border border-brandBlue-700/50">
          </div>

          <div id="services-grid" class="grid grid-cols-8 gap-2 bg-brandBlue-900/40 p-3 rounded-xl border border-brandBlue-700/30 max-h-48 overflow-y-auto">
            </div>

          <div class="mt-3 text-center">
            <a href="#" class="text-xs text-brandBlue-100 hover:underline">Didn't find the right service? Write to <span class="underline font-semibold">support</span></a>
          </div>
        </div>

        <div class="bg-brandBlue-900/60 p-1.5 rounded-xl flex space-x-1 border border-brandBlue-700/40">
          <button class="flex-1 bg-brandBlue-700 text-white text-xs font-bold py-2 rounded-lg shadow text-center rank-filter-btn" data-rank="all">All</button>
          <button class="flex-1 text-gray-300 hover:text-white text-xs font-medium py-2 rounded-lg text-center transition rank-filter-btn" data-rank="gold">Gold</button>
          <button class="flex-1 text-gray-300 hover:text-white text-xs font-medium py-2 rounded-lg text-center transition rank-filter-btn" data-rank="silver">Silver</button>
          <button class="flex-1 text-gray-300 hover:text-white text-xs font-medium py-2 rounded-lg text-center transition rank-filter-btn" data-rank="bronze">Bronze</button>
        </div>

        <div class="bg-brandBlue-800 rounded-2xl p-5 text-white shadow-md">
          <div class="flex items-center space-x-3 mb-3">
            <span class="w-6 h-6 rounded-full bg-brandBlue-600 text-white text-xs font-bold flex items-center justify-center border border-brandBlue-500">3</span>
            <span class="font-semibold text-sm tracking-wide">Select country</span>
          </div>

          <div class="relative mb-3">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400">
              <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </span>
            <input type="text" id="country-search-input" placeholder="Find country" class="w-full bg-brandBlue-900/60 text-white placeholder-gray-400 text-sm rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brandBlue-500 border border-brandBlue-700/50">
          </div>

          <p class="text-[11px] text-brandBlue-200 mb-3 font-medium">Countries are ranked by top performance</p>

          <div id="countries-container" class="space-y-3">
            </div>
        </div>

      </div>

    </div>
  </main>

  <div class="fixed bottom-6 right-6 flex items-center space-x-3 z-50">
    <button class="w-12 h-12 bg-brandBlue-700 hover:bg-brandBlue-800 text-white rounded-full shadow-lg flex items-center justify-center transition transform hover:scale-105">
      <i class="fa-solid fa-bell text-sm"></i>
    </button>
    <button class="w-12 h-12 bg-brandBlue-700 hover:bg-brandBlue-800 text-white rounded-full shadow-lg flex items-center justify-center transition transform hover:scale-105">
      <i class="fa-solid fa-comment text-sm"></i>
    </button>
  </div>

<script>
    const btn = document.getElementById('mobile-menu-btn');
    const menu = document.getElementById('mobile-menu');

    if (btn && menu) {
        btn.addEventListener('click', () => {
          menu.classList.toggle('hidden');
        });
    }

    const SMSGlobeApp = (() => {
      const API_BASE_URL = '/api';

      let currentMode = 'Number';
      let services = [];
      let expandedServiceCode = null;
      let serviceCountriesCache = {}; 
      let userBalance = 0;
      let userBonusBalance = 0;
      let pollInterval = null;
      let activePollIntervals = {};
      let selectedServiceCode = null;
      let selectedCountryId = null;

      const PRIORITY_ICONS = {
        'wa': 'https://api.iconify.design/logos:whatsapp-icon.svg',
        'tg': 'https://api.iconify.design/logos:telegram.svg',
        'gg': 'https://api.iconify.design/logos:google-icon.svg',
        'fb': 'https://api.iconify.design/logos:facebook.svg',
        'ig': 'https://api.iconify.design/logos:instagram-icon.svg',
        'tw': 'https://api.iconify.design/logos:twitter.svg',
        'nf': 'https://api.iconify.design/logos:netflix-icon.svg',
        'oi': 'https://api.iconify.design/simple-icons:tinder.svg',
        'ub': 'https://api.iconify.design/logos:uber.svg',
        'ms': 'https://api.iconify.design/logos:microsoft-icon.svg',
        'ds': 'https://api.iconify.design/logos:discord-icon.svg',
        'wx': 'https://api.iconify.design/logos:apple.svg'
      };
        
      function logout() {
        localStorage.removeItem('userToken');
        localStorage.removeItem('dashboard_cache');
        localStorage.removeItem('user_balance');
        window.location.href = 'login.html';
      }

      async function safeFetch(url, options = {}) {
        const res = await fetch(url, options);
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
            throw new Error("Server returned a non-JSON response or invalid content-type.");
        }
        const data = await res.json();
        return { res, data };
      }

      async function fetchUserProfile() {
        const token = localStorage.getItem('userToken');
        if (!token) return; 

        try {
            const { res, data } = await safeFetch(`${API_BASE_URL}/user-profile`, {
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Cache-Control': 'no-cache' 
                }
            });

            if (res.status === 401) return logout(); 

            if (res.status === 403 && data.isUnverified) {
                window.location.href = `user_create.html?verify_email=${encodeURIComponent(data.email || '')}`;
                return;
            }

            if (data.success) {
                const userData = data.user || data;
                userBalance = parseFloat(userData.balance || 0); 
                const bonusBalance = parseFloat(userData.bonusBalance || 0); 
                
                localStorage.setItem('dashboard_cache', JSON.stringify({ user: userData }));
                localStorage.setItem('user_balance', userBalance);

                const elBal = document.getElementById('displayBalance');
                const elBonus = document.getElementById('displayBonus');
                const elBonusContainer = document.getElementById('displayBonusContainer');

                if (elBal) elBal.innerText = `₦${userBalance.toLocaleString()}`;
                if (elBonus) elBonus.innerText = `₦${bonusBalance.toLocaleString()}`;
                if (elBonusContainer && bonusBalance > 0) {
                  elBonusContainer.classList.remove('hidden');
                }

                const userAvatarEl = document.getElementById('userAvatar');
                if (userAvatarEl) {
                    const identifier = userData.name || userData.fullName || userData.username || userData.email || 'U';
                    userAvatarEl.innerText = identifier.charAt(0).toUpperCase();
                }
            }
        } catch (err) {
            console.error("Failed to fetch profile details:", err);
        }
      }

      async function fetchServices() {
        const grid = document.getElementById('services-grid');
        if (grid) {
          grid.innerHTML = '<div class="col-span-8 text-center py-4 text-xs text-brandBlue-200"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Loading services...</div>';
        }

        try {
          const { res, data } = await safeFetch(`${API_BASE_URL}/services`);
          if (data.success && Array.isArray(data.services)) {
            services = data.services;
            renderServices(services);
          } else {
            throw new Error(data.message || "Invalid services payload format");
          }
        } catch (err) {
          console.error("Failed to load services:", err);
          if (grid) {
            grid.innerHTML = '<p class="text-xs text-red-300 col-span-8 text-center py-4">Failed to load services catalog</p>';
          }
        }
      }

      function renderServices(servicesToRender) {
        const grid = document.getElementById('services-grid');
        if (!grid) return;

        if (!servicesToRender || servicesToRender.length === 0) {
          grid.innerHTML = '<p class="text-xs text-gray-300 col-span-8 text-center py-4">No services found</p>';
          return;
        }

        grid.innerHTML = servicesToRender.map(service => {
          const code = (service.code || '').toLowerCase();
          const iconUrl = PRIORITY_ICONS[code] || `/api/service-image?id=${encodeURIComponent(code)}`;
          const fallbackLetter = (service.name || code || 'S').charAt(0).toUpperCase();
          const isSelected = expandedServiceCode === code || selectedServiceCode === code;
          const borderClass = isSelected ? 'border-brandBlue-400 bg-brandBlue-700' : 'border-brandBlue-700/50 bg-brandBlue-800/60';

          return `
            <button type="button" 
                    onclick="SMSGlobeApp.selectService('${code}')" 
                    class="flex flex-col items-center justify-center p-2 ${borderClass} hover:bg-brandBlue-700 rounded-lg border transition group relative h-14 shadow-sm"
                    title="${service.name}">
              <div class="w-9 h-9 flex items-center justify-center relative">
                <img src="${iconUrl}" alt="${service.name}" 
                     class="w-full h-full object-contain group-hover:scale-110 transition duration-200"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="w-9 h-9 rounded bg-brandBlue-600 text-white text-xs font-bold items-center justify-center hidden">
                  ${fallbackLetter}
                </div>
              </div>
            </button>
          `;
        }).join('');
      }

      async function selectService(serviceCode) {
        console.log("🔍 [DEBUG] Service selected:", serviceCode);
        expandedServiceCode = serviceCode;
        selectedServiceCode = serviceCode;
        renderServices(services);

        const countryGrid = document.getElementById('countries-grid');
        if (countryGrid) {
          countryGrid.innerHTML = '<p class="text-xs text-gray-300 col-span-full text-center py-4"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Loading countries and prices for ' + serviceCode + '...</p>';
        }

        try {
          if (!serviceCountriesCache[serviceCode]) {
            const targetUrl = `${API_BASE_URL}/countries?service=${encodeURIComponent(serviceCode)}`;
            console.log("🌐 [DEBUG] Fetching countries from:", targetUrl);

            const response = await fetch(targetUrl);
            const contentType = response.headers.get("content-type");
            
            if (!contentType || !contentType.includes("application/json")) {
              const textSnippet = await response.text();
              console.error("❌ [DEBUG] Non-JSON response received:", textSnippet);
              throw new Error(`Server returned non-JSON response (Status: ${response.status})`);
            }

            const result = await response.json();
            console.log("📦 [DEBUG] Countries API response data:", result);

            if (result.success === false) {
              throw new Error(result.message || "Failed to load countries from provider");
            }

            const rawInput = result.countries || result.data || result;
            let list = [];

            if (Array.isArray(rawInput)) {
              list = rawInput;
            } else if (typeof rawInput === 'object' && rawInput !== null) {
              list = Object.entries(rawInput).map(([k, v]) => ({ countryId: k, ...v }));
            }

            const countryMap = {};
            list.forEach(item => {
              const cId = String(item.countryId || item.id || item.code || '');
              if (!cId) return;

              const cName = item.countryName || item.name || `Country ${cId}`;
              const cCode = (item.code || (cId.length === 2 ? cId : 'un')).toLowerCase();
              const rawPrice = item.price?.amount || item.price || item.sellingPrice || 1400;
              const currencySymbol = item.price?.symbol || '₦';
              const rank = item.rank || 'Best Price';
              const stock = item.stock || item.count || 'In Stock';
              const flagUrl = item.flagUrl || `https://flagcdn.com/w40/${cCode}.png`;

              if (!countryMap[cId]) {
                countryMap[cId] = {
                  countryId: cId,
                  countryName: cName,
                  code: cCode,
                  flagUrl: flagUrl,
                  stock: stock,
                  rank: rank,
                  providerId: item.providerId || '',
                  price: {
                    amount: Number(rawPrice),
                    symbol: currencySymbol,
                    providerId: item.providerId || ''
                  },
                  availablePrices: []
                };
              }

              countryMap[cId].availablePrices.push({
                amount: Number(rawPrice),
                symbol: currencySymbol,
                rank: rank,
                stock: stock,
                providerId: item.providerId || ''
              });
            });

            const processedCountries = Object.values(countryMap).map(country => {
              country.availablePrices.sort((a, b) => a.amount - b.amount);
              country.price = country.availablePrices[0];
              return {
                ...country,
                selectedPriceIndex: 0
              };
            });

            processedCountries.sort((a, b) => {
              const lowestA = a.availablePrices[0]?.amount || 0;
              const lowestB = b.availablePrices[0]?.amount || 0;
              return lowestA - lowestB;
            });

            serviceCountriesCache[serviceCode] = processedCountries;
          }

          const countriesList = serviceCountriesCache[serviceCode] || [];
          console.log("🎨 [DEBUG] Rendering processed countries count:", countriesList.length);

          if (countriesList.length > 0) {
            renderCountries(countriesList);
          } else {
            if (countryGrid) {
              countryGrid.innerHTML = '<p class="text-xs text-gray-300 col-span-full text-center py-4">No countries available for this service.</p>';
            }
          }
        } catch (err) {
          console.error('❌ [DEBUG] Failed to load countries:', err);
          if (countryGrid) {
            countryGrid.innerHTML = `<p class="text-xs text-red-400 col-span-full text-center py-4 px-2">Error: ${err.message}. Check backend terminal logs.</p>`;
          }
        }
      }

      function renderCountriesListHtml(serviceCode, countriesList) {
        if (!countriesList || countriesList.length === 0) {
            return `
                <div class="flex flex-col items-center justify-center py-6 bg-white rounded-xl border border-brand-border col-span-full">
                    <p class="text-[10px] text-brandBlue-300 font-bold uppercase">No countries found.</p>
                </div>
            `;
        }

        let multiplier = 1;
        if (currentMode === 'rent') {
            const select = document.getElementById('rentalPeriod');
            if (select) {
                multiplier = parseFloat(select.options[select.selectedIndex]?.getAttribute('data-multi')) || 1;
            }
        }

        const countryCodeMap = {
            'united states': 'us', 'usa': 'us', 'united states (virtual)': 'us', 'america': 'us', 'canada': 'ca', 'mexico': 'mx', 'brazil': 'br', 'argentina': 'ar',
            'colombia': 'co', 'chile': 'cl', 'peru': 'pe', 'venezuela': 've', 'ecuador': 'ec', 'bolivia': 'bo', 'paraguay': 'py', 'uruguay': 'uy', 'costa rica': 'cr',
            'panama': 'pa', 'cuba': 'cu', 'dominican republic': 'do', 'puerto rico': 'pr', 'guatemala': 'gt', 'honduras': 'hn', 'el salvador': 'sv', 'nicaragua': 'ni', 'haiti': 'ht',
            'jamaica': 'jm', 'trinidad and tobago': 'tt', 'bahamas': 'bs', 'barbados': 'bb',
            'united kingdom': 'gb', 'uk': 'gb', 'great britain': 'gb', 'england': 'gb', 'germany': 'de', 'france': 'fr', 'italy': 'it', 'spain': 'es', 'ukraine': 'ua',
            'russia': 'ru', 'poland': 'pl', 'romania': 'ro', 'netherlands': 'nl', 'holland': 'nl', 'belgium': 'be', 'greece': 'gr', 'czech republic': 'cz', 'czechia': 'cz', 'portugal': 'pt', 'sweden': 'se',
            'hungary': 'hu', 'belarus': 'by', 'austria': 'at', 'switzerland': 'ch', 'bulgaria': 'bg', 'serbia': 'rs', 'denmark': 'dk', 'finland': 'fi', 'slovakia': 'sk', 'norway': 'no',
            'ireland': 'ie', 'croatia': 'hr', 'moldova': 'md', 'bosnia and herzegovina': 'ba', 'albania': 'al', 'lithuania': 'lt', 'north macedonia': 'mk', 'slovenia': 'si', 'latvia': 'lv',

            'botswana': 'bw', 'gabon': 'ga', 'lesotho': 'ls', 'guinea-bissau': 'gw', 'equatorial guinea': 'gq', 'mauritius': 'mu', 'eswatini': 'sz', 'djibouti': 'dj', 'comoros': 'km',
            'cape verde': 'cv', 'sao tome and principe': 'st', 'seychelles': 'sc', 'togo': 'tg', 'mauritania': 'mr', 'central african republic': 'cf', 'burkina faso': 'bf', 'kosovo': 'xk',
            'liberia': 'lr', 'congo (dem. republic)': 'cd', 'democratic republic of the congo': 'cd', 'macau': 'mo', 'lao people`s': 'la', 'laos': 'la', 'taiwan': 'tw', 'papua new guinea': 'pg', 'libya': 'ly', 'swaziland': 'sz', 'sierra leone': 'sl', 'belize': 'bz', 'dominica': 'dm', 'grenada': 'gd',

            'afghanistan': 'af', 'saudi arabia': 'sa', 'uzbekistan': 'uz', 'yemen': 'ye', 'malaysia': 'my', 'nepal': 'np', 'north korea': 'kp', 'sri lanka': 'lk',
            'kazakhstan': 'kz', 'syria': 'sy', 'cambodia': 'kh', 'jordan': 'jo', 'azerbaijan': 'az', 'united arab emirates': 'ae', 'uae': 'ae', 'tajikistan': 'tj',
            'israel': 'il', 'lebanon': 'lb', 'kyrgyzstan': 'kg', 'turkmenistan': 'tm', 'singapore': 'sg', 'palestine': 'ps', 'oman': 'om', 'kuwait': 'kw', 'georgia': 'ge',
            'mongolia': 'mn', 'armenia': 'am', 'qatar': 'qa', 'bahrain': 'bh', 'timor-leste': 'tl', 'bhutan': 'bt', 'maldives': 'mv', 'brunei': 'bn',
            'australia': 'au', 'new zealand': 'nz', 'fiji': 'fj', 'solomon islands': 'sb', 'vanuatu': 'vu', 'samoa': 'ws', 'kiribati': 'ki', 'micronesia': 'fm',
            'tonga': 'to', 'marshall islands': 'mh', 'palau': 'pw', 'tuvalu': 'tv', 'nauru': 'nr', 'french guiana': 'gf', 'niue': 'nu'
        };

        return countriesList.map(c => {
            const options = c.availablePrices || [{ amount: c.price?.amount, rank: c.rank, stock: c.stock, providerId: c.providerId }];
            const selectedIdx = c.selectedPriceIndex || 0;
            const activeTier = options[selectedIdx] || options[0];

            const finalDisplayPrice = Number(activeTier.amount || 0) * multiplier;
            const formattedPriceString = finalDisplayPrice.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            const stockStatus = activeTier.stock || c.stock || 'In Stock';
            const countryId = String(c.countryId || '').toLowerCase();
            const countryName = c.countryName || c.name || '';
            const cleanName = countryName.toLowerCase().trim();

            let flagCode = 'un';
            if (c.code && c.code.length === 2) {
                flagCode = c.code.toLowerCase();
            } else if (countryCodeMap[cleanName]) {
                flagCode = countryCodeMap[cleanName];
            } else {
                const matchedKey = Object.keys(countryCodeMap).find(key => cleanName.includes(key));
                if (matchedKey) {
                    flagCode = countryCodeMap[matchedKey];
                } else if (countryId.length === 2) {
                    flagCode = countryId;
                }
            }

            const rankLabel = activeTier.rank || 'Silver';
            const providerId = activeTier.providerId || c.providerId || '';
            const rankBadgeClass = rankLabel.toLowerCase().includes('silver') ? 'bg-gray-100 text-gray-700 border-gray-200' : 'bg-amber-50 text-amber-700 border-amber-200';

            return `
                <div class="bg-brandBlue-800/60 border border-brandBlue-700/50 p-2.5 sm:p-3 rounded-xl flex flex-wrap sm:flex-nowrap items-center justify-between gap-2.5 hover:border-brandBlue-400 transition-all">
                    <!-- Left Side: Flag & Name -->
                    <div class="flex items-center gap-2.5 min-w-0 flex-1">
                        <img src="https://flagcdn.com/w40/${flagCode}.png" class="w-5 sm:w-6 h-auto rounded-sm border border-gray-700 flex-shrink-0" onerror="this.src='https://flagcdn.com/w40/un.png'">
                        <div class="min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <p class="text-[11px] sm:text-xs font-bold text-white truncate max-w-[110px] sm:max-w-none">${countryName}</p>
                                <span class="text-[7px] sm:text-[8px] font-semibold px-1 py-0.2 rounded border ${rankBadgeClass} uppercase">${rankLabel}</span>
                            </div>
                            <span class="text-[8px] text-emerald-400 font-bold uppercase block">● ${stockStatus}</span>
                        </div>
                    </div>

                    <!-- Right Side Wrapper -->
                    <div class="flex items-center gap-2 ml-auto sm:ml-0 flex-shrink-0">
                        ${options.length > 1 ? `
                            <button onclick="SMSGlobeApp.shuffleCountryPriceTier('${serviceCode}', '${c.countryId}')" 
                                    title="Shuffle / Cycle alternative price tier"
                                    class="p-1.5 text-gray-300 hover:text-brandBlue-300 bg-brandBlue-700/50 hover:bg-brandBlue-700 rounded-lg transition-all border border-brandBlue-600 flex items-center justify-center">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                </svg>
                            </button>
                        ` : ''}

                        <div class="flex flex-col items-end">
                            <span class="text-[11px] sm:text-xs font-black text-brandBlue-300">₦${formattedPriceString}</span>
                            ${options.length > 1 ? `
                                <select onchange="SMSGlobeApp.switchCountryPriceTier('${serviceCode}', '${c.countryId}', this.value)" class="text-[8px] sm:text-[9px] text-gray-300 bg-brandBlue-900 border border-brandBlue-700 rounded px-1 py-0.2 mt-0.5 focus:outline-none max-w-[90px]">
                                    ${options.map((opt, idx) => `
                                        <option value="${idx}" ${idx === selectedIdx ? 'selected' : ''}>
                                            ${opt.rank || 'Tier'} - ₦${(Number(opt.amount) * multiplier).toLocaleString()}
                                        </option>
                                    `).join('')}
                                </select>
                            ` : ''}
                        </div>

                        <button onclick="SMSGlobeApp.buyServiceCountry('${serviceCode}', '${c.countryId}', ${finalDisplayPrice}, '${rankLabel}', '${providerId}')" 
                                class="px-2.5 sm:px-4 py-1.5 sm:py-2 bg-brandBlue-600 text-white rounded-lg text-[11px] sm:text-xs font-bold hover:bg-brandBlue-500 active:scale-95 transition-all flex-shrink-0">
                            Buy
                        </button>
                    </div>
                </div>
            `;
        }).join('');
      }

      function switchCountryPriceTier(serviceCode, countryId, newIndex) {
        const list = serviceCountriesCache[serviceCode];
        if (!list) return;
        const country = list.find(c => String(c.countryId) === String(countryId));
        if (country) {
            country.selectedPriceIndex = parseInt(newIndex, 10) || 0;
            renderCountries(list);
        }
      }

      function shuffleCountryPriceTier(serviceCode, countryId) {
        const list = serviceCountriesCache[serviceCode];
        if (!list) return;
        const country = list.find(c => String(c.countryId) === String(countryId));
        if (country && country.availablePrices && country.availablePrices.length > 1) {
            country.selectedPriceIndex = ((country.selectedPriceIndex || 0) + 1) % country.availablePrices.length;
            renderCountries(list);
        }
      }

      function buyServiceCountry(serviceCode, countryId, price, rank, providerId) {
        console.log("🛒 [DEBUG] Purchasing service:", { serviceCode, countryId, price, rank, providerId });
      }

      function renderCountries(countriesList) {
        const grid = document.getElementById('countries-grid');
        if (!grid) return;

        console.log("🎨 [DEBUG] Rendering advanced countries/tiers list, count:", countriesList.length);
        grid.innerHTML = renderCountriesListHtml(selectedServiceCode, countriesList);
      }

      function selectCountry(countryId, providerId) {
        console.log("🎯 [DEBUG] Country clicked/selected:", countryId, "Provider:", providerId);
        selectedCountryId = countryId;
        if (serviceCountriesCache[selectedServiceCode]) {
            renderCountries(serviceCountriesCache[selectedServiceCode]);
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        fetchUserProfile();
        fetchServices();

        const serviceSearchInput = document.getElementById('service-search-input');
        if (serviceSearchInput) {
          serviceSearchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            if (!term) {
              renderServices(services);
              return;
            }
            const filtered = services.filter(s => 
              (s.name && s.name.toLowerCase().includes(term)) || 
              (s.code && s.code.toLowerCase().includes(term))
            );
            renderServices(filtered);
          });
        }
      });

      return {
        fetchUserProfile,
        fetchServices,
        selectService,
        renderCountries,
        selectCountry,
        switchCountryPriceTier,
        shuffleCountryPriceTier,
        buyServiceCountry
      };
    })();
  </script>
</body>
</html>

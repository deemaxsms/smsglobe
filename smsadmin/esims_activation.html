<script>
    let currentOrders = [];

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
    }
async function fetchOrders() {
    const token = localStorage.getItem('smsglobe_admin_token');
    const tbody = document.getElementById('orders-body');

    try {
        const response = await fetch('/api/esim-activations', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();

        if (data.success) {
            currentOrders = data.orders; // Save to global
            tbody.innerHTML = data.orders.map(order => {
                return `
                    <tr class="hover:bg-gray-50/50 transition-colors border-b border-gray-100">
                        <td class="px-4 py-4">
                            <div class="font-bold text-brand-darkText">#${order.paymentReference.slice(-8)}</div>
                            <div class="text-[9px] font-black text-brand-blue uppercase tracking-tighter">${order.productType?.replace('_', ' ') || 'eSIM'}</div>
                        </td>
                        <td class="px-4 py-4">
                            <div class="text-[11px] font-bold text-brand-darkText">${order.fullName || 'User'}</div>
                            <div class="text-[10px] text-brand-orange font-medium mt-0.5">${order.email}</div>
                        </td>
                        <td class="px-4 py-4">
                            <div class="font-bold text-brand-darkText uppercase text-[10px]">${order.nodeName}</div>
                            <div class="text-[9px] text-brand-lightText font-bold">${order.planName}</div>
                        </td>
                        <td class="px-4 py-4 text-center">
                            <div class="font-black text-brand-blue text-[12px]">₦${parseFloat(order.amount).toLocaleString()}</div>
                        </td>
                        <td class="px-4 py-4">
                            <span class="px-2 py-1 rounded-md text-[9px] font-black uppercase ${getStatusClass(order.status)}">
                                ${order.status}
                            </span>
                        </td>
                        <td class="px-4 py-4 text-right">
                            <div class="flex items-center justify-end gap-2">
                                <button onclick="viewActivationDetails('${order.paymentReference}')" 
                                    class="px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg text-[10px] font-bold hover:bg-gray-200 transition-all">
                                    View
                                </button>
                                <button onclick="manageActivation('${order.paymentReference}')" 
                                    class="px-3 py-1.5 bg-brand-blue text-white rounded-lg text-[10px] font-bold hover:bg-blue-700 transition-all shadow-sm">
                                    Manage
                                </button>
                            </div>
                        </td>
                    </tr>`;
            }).join('');
        }
    } catch (err) {
        console.error("Fetch error:", err);
    }
}

// --- VIEW MODAL LOGIC ---
function viewActivationDetails(ref) {
    const order = currentOrders.find(o => o.paymentReference === ref);
    if (!order) return;

    const container = document.getElementById('detailContent');
    const date = new Date(order.createdAt).toLocaleString();

    container.innerHTML = `
        <div class="space-y-6">
            <div class="flex justify-between items-center border-b pb-4">
                <div>
                    <span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${
                        order.status === 'completed' || order.status === 'successful' 
                        ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'
                    }">
                        ${order.status}
                    </span>
                </div>
                <button id="modalGenReceiptBtn" 
                    class="flex items-center gap-2 px-4 py-2 bg-brand-blue text-white rounded-xl text-xs font-bold hover:shadow-lg transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Generate Receipt
                </button>
            </div>

            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <p class="text-[10px] text-blue-600 font-bold uppercase tracking-wider">Transaction Reference</p>
                <p class="font-mono font-bold text-brand-darkText break-all select-all">${order.paymentReference}</p>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <p class="text-[10px] text-brand-lightText font-bold uppercase">Carrier / Network</p>
                    <p class="font-bold text-sm text-brand-darkText uppercase">${order.nodeName || 'N/A'}</p>
                </div>
                <div>
                    <p class="text-[10px] text-brand-lightText font-bold uppercase">Device Model</p>
                    <p class="font-bold text-sm text-brand-darkText">${order.targetNumber || 'N/A'}</p>
                </div>
                <div>
                    <p class="text-[10px] text-brand-lightText font-bold uppercase">Activation Type</p>
                    <p class="font-medium text-sm px-2 py-0.5 bg-gray-100 rounded-md w-fit">${order.activationType || 'Standard'}</p>
                </div>
                <div>
                    <p class="text-[10px] text-brand-lightText font-bold uppercase">Order Date</p>
                    <p class="font-medium text-sm text-gray-600">${date}</p>
                </div>
            </div>

            <div class="border-t pt-4">
                <h4 class="text-[11px] font-bold text-brand-blue uppercase mb-3">Subscriber Information</h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <div class="col-span-1">
                        <p class="text-[10px] text-brand-lightText font-bold uppercase">Full Name</p>
                        <p class="font-bold text-sm">${order.fullName || 'N/A'}</p>
                    </div>
                    <div class="col-span-1">
                        <p class="text-[10px] text-brand-lightText font-bold uppercase">Activation Email</p>
                        <p class="font-bold text-sm text-blue-600 underline underline-offset-2">${order.email || order.userEmail}</p>
                    </div>
                    <div class="col-span-2">
                        <p class="text-[10px] text-brand-lightText font-bold uppercase">Residential Address</p>
                        <p class="font-medium text-sm text-gray-700 leading-relaxed">${order.address || 'N/A'}</p>
                    </div>
                    <div>
                        <p class="text-[10px] text-brand-lightText font-bold uppercase">Zip / Postal Code</p>
                        <p class="font-bold text-sm">${order.zipCode || 'N/A'}</p>
                    </div>
                    <div>
                        <p class="text-[10px] text-brand-lightText font-bold uppercase">Account Owner</p>
                        <p class="font-medium text-xs text-gray-500">${order.userEmail}</p>
                    </div>
                </div>
            </div>

            <div class="py-4 border-t border-b">
                <p class="text-[10px] text-brand-lightText font-bold uppercase mb-1 text-center">eSIM Confirmation Number / PIN</p>
                <div class="bg-green-50 border-2 border-dashed border-green-200 p-4 rounded-xl text-center">
                    <p class="font-mono font-bold text-2xl text-green-700 tracking-widest">${order.confirmationNumber || 'PENDING'}</p>
                </div>
            </div>

            <div class="bg-brand-dark text-white p-4 rounded-xl shadow-lg">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-medium text-gray-300">Total Amount Charged:</span>
                    <b class="text-xl">₦${parseFloat(order.amount).toLocaleString()}</b>
                </div>
            </div>
        </div>
    `;

    document.getElementById('modalGenReceiptBtn').onclick = () => showReceiptOptions(order);
    document.getElementById('detailModal').classList.remove('hidden');
}

function manageActivation(ref) {
    const order = currentOrders.find(o => o.paymentReference === ref);
    if (!order) return;

    const container = document.getElementById('detailContent');
    container.innerHTML = `
        <div class="space-y-5">
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Status</label>
                <select id="updateStatus" class="w-full border border-gray-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-brand-blue outline-none">
                    <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                    <option value="processing" ${order.status === 'processing' ? 'selected' : ''}>Processing</option>
                    <option value="completed" ${order.status === 'completed' ? 'selected' : ''}>Completed</option>
                    <option value="failed" ${order.status === 'failed' ? 'selected' : ''}>Failed</option>
                </select>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Activation PIN / Confirmation Code</label>
                <input type="text" id="updateConf" value="${order.confirmationNumber || ''}" 
                    class="w-full border border-gray-200 rounded-xl p-3 text-sm font-mono focus:ring-2 focus:ring-brand-blue outline-none" 
                    placeholder="e.g. LPA:1$SMSG.COM$...">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Upload Receipt (Image or PDF)</label>
                <div class="relative border-2 border-dashed border-gray-200 rounded-xl p-4 hover:border-brand-blue transition-colors group">
                    <input type="file" id="receiptFile" accept="image/*,.pdf" 
                        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                        onchange="handleFileSelect(this)">
                    <div class="text-center">
                        <svg class="w-8 h-8 mx-auto text-gray-400 group-hover:text-brand-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        <p id="fileNameDisplay" class="text-xs text-gray-500 mt-2">Click to upload or drag and drop</p>
                    </div>
                </div>
                ${order.receiptUrl ? `<p class="text-[10px] text-green-600 mt-1">✓ Current receipt exists</p>` : ''}
            </div>

            <div class="pt-4 border-t">
                <button id="saveOrderBtn" onclick="saveOrderUpdate('${order.paymentReference}')" 
                    class="w-full bg-brand-blue text-white py-3 rounded-xl font-bold hover:bg-blue-800 transition-all shadow-lg shadow-blue-200 flex justify-center items-center gap-2">
                    <span>Update Order Details</span>
                </button>
            </div>
        </div>
    `;
    document.getElementById('detailModal').classList.remove('hidden');
}

// Visual helper for file selection
function handleFileSelect(input) {
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    if (input.files && input.files[0]) {
        fileNameDisplay.innerText = input.files[0].name;
        fileNameDisplay.classList.add('text-brand-blue', 'font-bold');
    }
}

async function saveOrderUpdate(tid) {
    const status = document.getElementById('updateStatus').value;
    const confirmationNumber = document.getElementById('updateConf').value.trim();
    const btn = document.getElementById('saveOrderBtn');

    btn.disabled = true;
    btn.innerHTML = `<span class="flex items-center justify-center gap-2">Processing...</span>`;

    try {
        const response = await fetch('/api/esim-activation-complete', {
            method: 'POST',
            headers: { 
                'Authorization': `Bearer ${localStorage.getItem('smsglobe_admin_token')}`,
                'Content-Type': 'application/json' 
            },
            body: JSON.stringify({ tid, status, confirmationNumber })
        });
        const data = await response.json();
        if (data.success) {
            document.getElementById('detailModal').classList.add('hidden');
            fetchOrders();
        } else { alert(data.message); }
    } catch (err) { alert("Connection Error"); }
    finally { btn.disabled = false; btn.innerText = "Update Order Details"; }
}

// --- RECEIPT UTILITIES (PDF/PNG) ---

    const overlay = document.createElement('div');
    overlay.id = "receiptSelectorOverlay";
    overlay.className = "fixed inset-0 z-[110] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4";
    overlay.innerHTML = `
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl scale-in-center">
            <h3 class="text-lg font-bold text-gray-900 mb-1">Download Receipt</h3>
            <p class="text-xs text-gray-500 mb-6">Choose your preferred format for this activation.</p>
            <div class="space-y-3">
                <button id="downloadPdfBtn" class="w-full flex items-center justify-between p-4 bg-red-50 hover:bg-red-100 border border-red-200 rounded-xl transition-all">
                    <span class="font-bold text-red-700 text-sm">PDF Document</span>
                    <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
                <button id="downloadImgBtn" class="w-full flex items-center justify-between p-4 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-xl transition-all">
                    <span class="font-bold text-blue-700 text-sm">Image (PNG)</span>
                    <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
            <button onclick="document.getElementById('receiptSelectorOverlay').remove()" class="mt-6 w-full py-2 text-xs font-bold text-gray-400 hover:text-gray-900 uppercase tracking-widest">Close</button>
        </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('downloadPdfBtn').onclick = () => { overlay.remove(); generateUniversalReceipt(order, 'pdf'); };
    document.getElementById('downloadImgBtn').onclick = () => { overlay.remove(); generateUniversalReceipt(order, 'image'); };
}

async function generateUniversalReceipt(order, format) {
    const receiptDiv = document.createElement('div');
    // Set position relative to allow absolute positioning of watermark
    Object.assign(receiptDiv.style, { 
        width: '350px', 
        padding: '30px', 
        background: '#fff', 
        position: 'absolute', 
        left: '-9999px', 
        fontFamily: "'Inter', system-ui, sans-serif",
        color: '#1a1a1a',
        overflow: 'hidden' // Important for watermark
    });
    
    const logoUrl = 'https://i.imgur.com/8YeZgfx.png';
    const date = new Date(order.createdAt).toLocaleDateString('en-NG', {
        year: 'numeric', month: 'long', day: 'numeric'
    });

    receiptDiv.innerHTML = `
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%) rotate(-45deg); 
            font-size:40px; color:rgba(15, 84, 198, 0.05); font-weight:900; white-space:nowrap; pointer-events:none; z-index:0; text-transform:uppercase;">
            SMS GLOBE GLOBAL
        </div>

        <div style="position:relative; z-index:1;">
            <div style="text-align:center; margin-bottom:25px;">
                <img src="${logoUrl}" style="width:50px; height:auto; margin:0 auto 10px auto; display:block;">
                <h1 style="font-size:14px; margin:0; color:#0f54c6; text-transform:uppercase; letter-spacing:1px;">Official Receipt</h1>
                <p style="font-size:10px; color:#64748b; margin-top:4px;">${date}</p>
            </div>

            <div style="background:#f8fafc; border-radius:12px; padding:15px; margin-bottom:20px; border:1px solid #e2e8f0;">
                <p style="font-size:9px; color:#64748b; margin:0 0 4px 0; text-transform:uppercase;">Total Amount Paid</p>
                <h2 style="font-size:24px; color:#0f54c6; margin:0; font-weight:800;">₦${parseFloat(order.amount).toLocaleString()}</h2>
            </div>

            <div style="font-size:11px; line-height:1.6;">
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f1f5f9; padding:6px 0;">
                    <span style="color:#64748b;">Reference:</span>
                    <span style="font-weight:700; font-family:monospace;">${order.paymentReference}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f1f5f9; padding:6px 0;">
                    <span style="color:#64748b;">Carrier:</span>
                    <span style="font-weight:600;">${order.nodeName || 'N/A'}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f1f5f9; padding:6px 0;">
                    <span style="color:#64748b;">Device:</span>
                    <span style="font-weight:600;">${order.targetNumber || 'eSIM Device'}</span>
                </div>
                 <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f1f5f9; padding:6px 0;">
                    <span style="color:#64748b;">Plan:</span>
                    <span style="font-weight:600;">${order.planName}</span>
                </div>
            </div>

            <div style="margin-top:20px; padding:12px; background:#fff; border:1px solid #f1f5f9; border-radius:8px;">
                <p style="font-size:9px; color:#64748b; margin:0 0 5px 0; font-weight:bold; text-transform:uppercase;">Subscriber Info</p>
                <p style="font-size:11px; margin:2px 0;"><b>Name:</b> ${order.fullName || 'N/A'}</p>
                <p style="font-size:11px; margin:2px 0;"><b>Email:</b> ${order.email || order.userEmail}</p>
                <p style="font-size:10px; margin:2px 0; color:#475569;"><b>Address:</b> ${order.address || 'N/A'}, ${order.zipCode || ''}</p>
            </div>

            <div style="margin-top:25px; text-align:center; padding-top:15px; border-top:2px dashed #e2e8f0;">
                <p style="font-size:9px; color:#64748b; margin-bottom:5px;">CONFIRMATION NUMBER</p>
                <p style="font-size:14px; font-weight:800; color:#16a34a; font-family:monospace; margin:0;">${order.confirmationNumber || 'VERIFIED'}</p>
                <div style="margin-top:20px;">
                    <p style="font-size:10px; font-weight:700; color:#0f54c6; margin:0;">SMS GLOBE GLOBAL CONNECTIVITY</p>
                    <p style="font-size:8px; color:#94a3b8; margin-top:4px;">This is an electronically generated receipt.</p>
                </div>
            </div>
        </div>
    `;
    
    document.body.appendChild(receiptDiv);

    try {
        const canvas = await html2canvas(receiptDiv, { 
            scale: 3, 
            useCORS: true,
            logging: false,
            backgroundColor: '#ffffff'
        });
        
        const imgData = canvas.toDataURL('image/png');
        
        if (format === 'image') {
            const link = document.createElement('a');
            link.download = `SMS-GLOBE-Receipt-${order.paymentReference}.png`;
            link.href = imgData;
            link.click();
        } else {
            const { jsPDF } = window.jspdf;
            // Height adjusted to 160mm to fit extra subscriber info
            const pdf = new jsPDF('p', 'mm', [80, 160]); 
            pdf.addImage(imgData, 'PNG', 0, 0, 80, 160);
            pdf.save(`SMS-GLOBE-Receipt-${order.paymentReference}.pdf`);
        }
    } catch (error) {
        console.error("Receipt Generation Error:", error);
    } finally {
        document.body.removeChild(receiptDiv);
    }
}
function getStatusClass(status) {
    const s = status.toLowerCase();
    if (s === 'completed' || s === 'successful') return 'bg-green-100 text-green-700';
    if (s === 'processing') return 'bg-blue-100 text-blue-700';
    if (s === 'pending') return 'bg-orange-100 text-orange-700';
    return 'bg-gray-100 text-gray-700';
}

function logout() { localStorage.removeItem('smsglobe_admin_token'); window.location.href = 'sms_login.html'; }
window.onload = fetchOrders;
</script>

            async function safeFetch(url, options = {}) {
            const res = await fetch(url, options);
            const contentType = res.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                throw new Error("Server returned a non-JSON response or invalid content-type.");
            }
            const data = await res.json();
            return { res, data };
        }

   async function fetchUserProfile() {
    const token = localStorage.getItem('userToken');
    if (!token) return; 

    try {
        const { res, data } = await safeFetch(`${API_BASE_URL}/user-profile`, {
            headers: { 
                'Authorization': `Bearer ${token}`,
                'Cache-Control': 'no-cache' 
            }
        });

        if (res.status === 401) return logout(); 

        if (res.status === 403 && data.isUnverified) {
            window.location.href = `user_create.html?verify_email=${encodeURIComponent(data.email || '')}`;
            return;
        }

        if (data.success) {
            const userData = data.user || data;
            
            // Update global balance variable & parse safely as float
            userBalance = parseFloat(userData.balance || 0); 
            const bonusBalance = parseFloat(userData.bonusBalance || 0); 
            
            // Cache locally including balance for persistence across reloads
            localStorage.setItem('dashboard_cache', JSON.stringify({ user: userData }));
            localStorage.setItem('user_balance', userBalance);

            // Update UI Balances
            const elBal = document.getElementById('displayBalance');
            const elBonus = document.getElementById('displayBonus');
            if (elBal) elBal.innerText = `₦${userBalance.toLocaleString()}`;
            if (elBonus) elBonus.innerText = `₦${bonusBalance.toLocaleString()}`;

            // Update User Avatar Initial
            const userAvatarEl = document.getElementById('userAvatar');
            if (userAvatarEl) {
                const identifier = userData.name || userData.fullName || userData.username || userData.email || 'U';
                userAvatarEl.innerText = identifier.charAt(0).toUpperCase();
            }
        }
    } catch (err) {
        console.error("Failed to fetch profile details:", err);
    }
}

window.setMode = function(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => {
        b.classList.remove('active');
        b.classList.add('text-brand-lightText');
    });
    
    if (mode === 'activation') {
        document.getElementById('btnActivation').classList.add('active');
        document.getElementById('btnActivation').classList.remove('text-brand-lightText');
        document.getElementById('rentPeriodSection').classList.add('hidden');
    } else {
        document.getElementById('btnRent').classList.add('active');
        document.getElementById('btnRent').classList.remove('text-brand-lightText');
        document.getElementById('rentPeriodSection').classList.remove('hidden');
    }
    
    if (typeof expandedServiceCode !== 'undefined' && expandedServiceCode) {
        renderServiceAccordion();
    }
}
        async function syncInventory() {
            const container = document.getElementById('serviceAccordionList');
            if (container && services.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 bg-white rounded-2xl border border-brand-border">
                        <div class="w-6 h-6 border-2 border-brand-blue border-t-transparent rounded-full animate-spin mb-3"></div>
                        <p class="text-[10px] text-brand-blue font-black uppercase tracking-widest">Loading Live SMSGlobe Services...</p>
                    </div>
                `;
            }

            try {
                const { data } = await safeFetch(`${API_BASE_URL}/services`);
                const serviceList = data.services || data.data || data;

                if (Array.isArray(serviceList)) {
                    services = serviceList.sort((a, b) => {
                        const codeA = (a.code || '').toLowerCase();
                        const codeB = (b.code || '').toLowerCase();
                        const indexA = PRIORITY_SERVICES.findIndex(p => p.code === codeA);
                        const indexB = PRIORITY_SERVICES.findIndex(p => p.code === codeB);

                        if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                        if (indexA !== -1) return -1;
                        if (indexB !== -1) return 1;

                        return (a.name || '').localeCompare(b.name || '');
                    });

                    renderServiceAccordion();
                    preFetchAllServiceCountries();
                }
            } catch (err) {
                console.error("Service sync failed", err);
                if (container) {
                    container.innerHTML = `<p class="text-center text-xs py-10 text-red-500 font-bold uppercase bg-white rounded-2xl border border-brand-border">Failed to load live services from backend</p>`;
                }
            }
        }

      async function preFetchAllServiceCountries() {
    const servicesToFetch = services.filter(s => s.code && !serviceCountriesCache[s.code]);
        const batchSize = 4;
    for (let i = 0; i < servicesToFetch.length; i += batchSize) {
        const batch = servicesToFetch.slice(i, i + batchSize);
                await Promise.all(
            batch.map(s => fetchCountriesForService(s.code, true))
        );
                await new Promise(resolve => setTimeout(resolve, 50));
    }
}

function renderServiceAccordion(filter = "") {
    const container = document.getElementById('serviceAccordionList');
    if (!container) return;

       async function fetchCountriesForService(serviceCode, isBackground = false) {
    if (!serviceCode || serviceCode === 'undefined' || serviceCode === 'null') return;

    try {
        const { data: result } = await safeFetch(`${API_BASE_URL}/countries?service=${encodeURIComponent(serviceCode)}`);
        let list = [];
        const data = result.countries || result.data || result;

        const parseItems = (rawInput) => {
            if (Array.isArray(rawInput)) return rawInput;
            if (typeof rawInput === 'object' && rawInput !== null) {
                return Object.entries(rawInput).map(([k, v]) => ({ countryId: k, ...v }));
            }
            return [];
        };

        list = parseItems(data);

        const countryMap = {};
        list.forEach(item => {
            const cId = String(item.countryId || item.id || item.code || '');
            if (!cId) return;

            const cName = item.countryName || item.name || `Country ${cId}`;
            // Capture the ISO code sent from the backend, or default to lowercase cId if it looks like a 2-letter code
            const cCode = (item.code || (cId.length === 2 ? cId : 'un')).toLowerCase();
            const rawPrice = item.price?.amount || item.price || item.sellingPrice || 1400;
            const rank = item.rank || 'Silver';
            const stock = item.stock || item.count || 'In Stock';

            if (!countryMap[cId]) {
                countryMap[cId] = {
                    countryId: cId,
                    countryName: cName,
                    code: cCode, // Stored for CDN flag rendering
                    availablePrices: []
                };
            }

            countryMap[cId].availablePrices.push({
                amount: Number(rawPrice),
                rank: rank,
                stock: stock,
                providerId: item.providerId || ''
            });
        });

        // Post-process countries: sort options ascending so index 0 is always the absolute lowest price
        const processedCountries = Object.values(countryMap).map(country => {
            country.availablePrices.sort((a, b) => a.amount - b.amount);
            return {
                ...country,
                selectedPriceIndex: 0 
            };
        });

        // SORT ENTIRE COUNTRIES LIST BY LOWEST PRICE ASCENDING (Lowest price starting from bottom up / top)
        processedCountries.sort((a, b) => {
            const lowestA = a.availablePrices[0]?.amount || 0;
            const lowestB = b.availablePrices[0]?.amount || 0;
            return lowestA - lowestB;
        });

        serviceCountriesCache[serviceCode] = processedCountries;
    } catch (err) {
        console.error("Failed to fetch countries for service:", err);
        if (!isBackground) {
            serviceCountriesCache[serviceCode] = [];
        }
    }

    if (!isBackground && expandedServiceCode === serviceCode) {
        renderServiceAccordion(document.getElementById('serviceSearchInput')?.value || '');
    }
}

        function switchCountryPriceTier(serviceCode, countryId, priceIndex) {
            const countries = serviceCountriesCache[serviceCode];
            if (!countries) return;

            const country = countries.find(c => String(c.countryId) === String(countryId));
            if (country) {
                country.selectedPriceIndex = parseInt(priceIndex, 10);
                const query = document.getElementById('serviceSearchInput')?.value || '';
                const listContainer = document.getElementById(`countriesList_${serviceCode}`);
                if (listContainer) {
                    listContainer.innerHTML = renderCountriesListHtml(serviceCode, countries.filter(c => (c.countryName || '').toLowerCase().includes(query.toLowerCase())));
                }
            }
        }

        // Shuffle action button helper to cycle through available price tiers for a specific country
        function shuffleCountryPriceTier(serviceCode, countryId, buttonElement) {
            const countries = serviceCountriesCache[serviceCode];
            if (!countries) return;

            const country = countries.find(c => String(c.countryId) === String(countryId));
            if (!country || !country.availablePrices || country.availablePrices.length <= 1) return;

            // Visual spin feedback
            const svgIcon = buttonElement.querySelector('svg');
            if (svgIcon) svgIcon.classList.add('animate-spin');

            setTimeout(() => {
                if (svgIcon) svgIcon.classList.remove('animate-spin');
                
                // Cycle to next price tier index
                country.selectedPriceIndex = (country.selectedPriceIndex + 1) % country.availablePrices.length;
                
                const query = document.getElementById('serviceSearchInput')?.value || '';
                const listContainer = document.getElementById(`countriesList_${serviceCode}`);
                if (listContainer) {
                    listContainer.innerHTML = renderCountriesListHtml(serviceCode, countries.filter(c => (c.countryName || '').toLowerCase().includes(query.toLowerCase())));
                }
            }, 300);
        }

        function filterCountriesForService(serviceCode, query) {
            const allCountries = serviceCountriesCache[serviceCode] || [];
            const filtered = allCountries.filter(c => (c.countryName || '').toLowerCase().includes(query.toLowerCase()));
            const listContainer = document.getElementById(`countriesList_${serviceCode}`);
            if (listContainer) {
                listContainer.innerHTML = renderCountriesListHtml(serviceCode, filtered);
            }
        }

        }

    try {
        const response = await safeFetch(`${API_BASE_URL}/purchase-with-wallet`, { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(payload)
        });
        
        const res = response.data;

        if (res && res.success) {
            const realMobileNumber = res.phoneNumber || res.number || res.targetNumber || res.order?.phoneNumber || res.order?.targetNumber || res.order?.number || res.data?.phoneNumber || 'N/A';
            const orderId = res.order?._id || res.order?.id || res.orderId;
            
            let activeOrders = JSON.parse(localStorage.getItem('sms_active_orders') || '[]');
            const newActiveOrder = {
                id: orderId,
                phoneNumber: realMobileNumber,
                serviceName: serviceObj?.name || serviceCode,
                countryName: countryObj?.countryName || 'Selected Country',
                countryFlag: countryObj?.flag || countryObj?.flagUrl || countryObj?.icon || '', // Captures the flag source
                status: 'Waiting for SMS...',
                smsCode: null,
                fullMessage: null,
                createdAt: Date.now()
            };

            activeOrders = [newActiveOrder, ...activeOrders.filter(o => o.id !== orderId)];
            localStorage.setItem('sms_active_orders', JSON.stringify(activeOrders));

            renderActiveOrdersDashboard();
            startPersistentSmsPolling(orderId);
            fetchUserProfile();

            Swal.fire({
                title: 'Order Dispatched!',
                text: 'Your number is ready. Waiting for live SMS verification code...',
                icon: 'success',
                timer: 2000,
                showConfirmButton: false
            });
        } else { 
            Swal.fire('Order Failed', res?.message || "Could not process purchase from provider.", 'error');
        }
    } catch (err) { 
        console.error("Purchase Error:", err);
        Swal.fire('Network Error', 'Check your connection and try again.', 'error');
    }
}

function renderActiveOrdersDashboard() {

        document.body.appendChild(container);
    }

    const activeOrders = JSON.parse(localStorage.getItem('sms_active_orders') || '[]');

        container.innerHTML = '';
        container.style.display = 'none';
        return;
    }

    // Ensure modal is visible if orders exist
    container.style.display = 'flex';

    container.innerHTML = `
        <div class="bg-white border border-brand-blue/30 rounded-2xl p-5 sm:p-6 shadow-2xl w-full max-w-lg relative animate-in fade-in zoom-in duration-200">
            <!-- Modal Header with Close Button -->

                <h3 class="text-xs font-black text-brand-blue uppercase tracking-wider flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-brand-blue animate-ping"></span>
                    Active Numbers & Live OTP Feed
                </h3>
                <div class="flex items-center gap-3">
                    <span class="text-[10px] bg-brand-blue text-white px-2.5 py-0.5 rounded-full font-bold">Persistent Session</span>
                    <button onclick="closeActiveOrdersModal()" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center font-bold text-sm transition-colors" title="Close Modal">
                        &times;
                    </button>
                </div>
            </div>
            
         <!-- Scrollable Orders List Container -->
    <div class="space-y-3 max-h-[70vh] overflow-y-auto pr-1">
        ${activeOrders.map(order => {
            // Fallback resolver for phone number to prevent "undefined" display
            const displayNum = order.phoneNumber || order.targetNumber || order.number || order.data?.phoneNumber || 'N/A';
            const sName = order.serviceName || order.service || 'Service';
            const cName = order.countryName || order.country || '';
            
            // Flag resolver supporting multiple schema fields
            const flagUrl = order.countryFlag || order.flag || order.flagUrl || order.icon || '';
            const flagHtml = flagUrl 
                ? `<img src="${flagUrl}" class="w-5 h-3.5 object-cover rounded-xs shadow-2xs inline-block shrink-0" alt="flag">` 
                : '';

            return `
                <div class="bg-gray-50/70 border border-brand-border p-4 rounded-xl flex flex-col gap-3 shadow-2xs" id="persistent-order-${order.id || order.tzid}">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            ${flagHtml}
                            <span class="text-xs font-bold text-brand-darkText">${sName} <span class="text-brand-lightText font-normal">(${cName})</span></span>
                        </div>
                        <span class="text-[10px] px-2 py-0.5 rounded font-bold ${order.smsCode ? 'bg-green-100 text-green-700' : 'bg-amber-50 text-amber-700 border border-amber-200'}">${order.status || 'pending'}</span>
                    </div>

                    <!-- Number Box -->
                    <div class="flex items-center justify-between bg-white border border-gray-200 px-3.5 py-2.5 rounded-xl shadow-xs">
                        <span class="font-mono text-sm sm:text-base font-black text-brand-darkText tracking-wide">${displayNum}</span>
                        <button onclick="navigator.clipboard.writeText('${displayNum}'); Swal.fire({title: 'Number Copied!', toast: true, position: 'top-end', showConfirmButton: false, timer: 1000, icon: 'success'});" 
                                class="text-xs bg-brand-blue/10 text-brand-blue hover:bg-brand-blue hover:text-white px-3 py-1.5 rounded-lg font-bold transition-all">
                            Copy Number
                        </button>
                    </div>

                    <!-- OTP Box / Status -->
                    <div>
                        ${order.smsCode ? `
                            <div class="bg-green-50 border border-green-200 p-3 rounded-xl flex flex-col gap-2">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-bold text-green-800 uppercase tracking-wide">Verification Code Received:</span>
                                    <button onclick="navigator.clipboard.writeText('${order.smsCode}'); Swal.fire({title: 'OTP Copied!', toast: true, position: 'top-end', showConfirmButton: false, timer: 1000, icon: 'success'});" 
                                            class="text-xs bg-green-600 text-white px-2.5 py-1 rounded-md font-bold">Copy OTP</button>
                                </div>
                                <div class="flex gap-1.5 justify-center py-1">
                                    ${order.smsCode.split('').map(d => `
                                        <div class="w-10 h-12 bg-green-600 text-white rounded-xl flex items-center justify-center text-xl font-black shadow-md">

// Global helper function to close/hide the active orders modal overlay
window.closeActiveOrdersModal = function() {
    const container = document.getElementById('activeOrdersContainer');
    if (container) {
        container.style.display = 'none';
    }
}

window.cancelActiveOrder = async function(orderId) {
    const confirmResult = await Swal.fire({
        title: 'Cancel Number & Get Refund?',
        text: "If you haven't received your code, cancelling will return your funds back to your wallet instantly.",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Yes, Cancel & Refund!'
    });

    if (!confirmResult.isConfirmed) return;

    try {
        Swal.fire({ title: 'Processing refund...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        // Use 'userToken' to match fetchUserProfile()
        const token = localStorage.getItem('userToken');

        const { res, data } = await safeFetch(`/api/cancel-order`, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}` 
            },
            body: JSON.stringify({ id: orderId })
        });

        Swal.close();

        if (res.status === 401) return logout();

        if (data && data.success) {
            Swal.fire({
                icon: 'success',
                title: 'Refund Successful!',
                text: data.message,
                timer: 2500
            });

            // Clean up localStorage active orders cache
            let activeOrders = JSON.parse(localStorage.getItem('sms_active_orders') || '[]');
            activeOrders = activeOrders.filter(o => (o._id !== orderId && o.id !== orderId && o.tzid !== orderId));
            localStorage.setItem('sms_active_orders', JSON.stringify(activeOrders));

            // Refresh UI dashboards & wallet balance
            if (typeof fetchActiveOrders === 'function') fetchActiveOrders();
            if (typeof renderActiveOrdersDashboard === 'function') renderActiveOrdersDashboard();
            if (typeof fetchUserProfile === 'function') fetchUserProfile(); // Refresh wallet balance automatically via profile fetch
        } else {
            Swal.fire({
                icon: 'error',
                title: 'Cancellation Failed',
                text: (data && data.message) || 'Could not cancel the order.'
            });
        }
    } catch (err) {
        console.error("Cancel order frontend error:", err);
        Swal.fire({ icon: 'error', title: 'Error', text: 'Network error connecting to server.' });
    }
};
        function copyNumber() {
            const num = document.getElementById('displayPurchasedNumber')?.innerText || '';
            navigator.clipboard.writeText(num);
            Swal.fire({ title: 'Copied!', toast: true, position: 'top-end', showConfirmButton: false, timer: 1000, icon: 'success' });
        }

      function startPersistentSmsPolling(orderId) {
    if (activePollIntervals[orderId]) return;

    let attempts = 0;
    const maxAttempts = 75; // ~5 minutes of polling

    activePollIntervals[orderId] = setInterval(async () => {
        attempts++;
        if (attempts >= maxAttempts) {
            clearInterval(activePollIntervals[orderId]);
            delete activePollIntervals[orderId];
            return;
        }

        try {
            const { data } = await safeFetch(`${API_BASE_URL}/order-details?id=${orderId}`, {
                headers: { 'Authorization': `Bearer ${localStorage.getItem('userToken')}` }
            });
            
            if (data.success && data.order && data.order.smsCode) {
                clearInterval(activePollIntervals[orderId]);
                delete activePollIntervals[orderId];

                // Update local storage record with received code
                let activeOrders = JSON.parse(localStorage.getItem('sms_active_orders') || '[]');
                activeOrders = activeOrders.map(o => {
                    if (o.id === orderId) {
                        return {
                            ...o,
                            status: 'Completed',
                            smsCode: data.order.smsCode,
                            fullMessage: data.order.fullMessage || 'Code received successfully.'
                        };
                    }
                    return o;
                });
                localStorage.setItem('sms_active_orders', JSON.stringify(activeOrders));

                // Re-render UI to show OTP cards
                renderActiveOrdersDashboard();

                Swal.fire({
                    title: 'SMS Code Received!',
                    text: `Verification Code: ${data.order.smsCode}`,
                    icon: 'success',
                    confirmButtonColor: '#0F54C6'
                });
            }
        } catch (err) {
            console.error("Polling error:", err);
        }
    }, 4000);
}

window.manualRecheckSms = async function(orderId) {
    try {
        Swal.fire({ title: 'Checking with provider...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        
        // safeFetch returns the parsed JSON body directly
        const data = await safeFetch(`/api/recheck-sms`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: orderId })
        });
        
        Swal.close();

        if (data && data.success && data.code) {
            Swal.fire({ icon: 'success', title: 'OTP Received!', text: `Code: ${data.code}`, timer: 2000 });
        } else {
            Swal.fire({ icon: 'info', title: 'Still Waiting', text: (data && data.message) || 'No SMS code arrived yet.', timer: 2000 });
        }
        
        if (typeof fetchActiveOrders === 'function') fetchActiveOrders();
        if (typeof renderActiveOrdersDashboard === 'function') renderActiveOrdersDashboard();
    } catch (err) {
        console.error("Manual recheck error:", err);
        Swal.fire({ icon: 'error', title: 'Error', text: 'Could not connect to server to recheck SMS.' });
    }
};

        function logout() {
            localStorage.removeItem('userToken');
            localStorage.removeItem('dashboard_cache');
            window.location.href = 'user_login.html';
        }

        function toggleSidebar() {
            document.getElementById('sidebar')?.classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay')?.classList.toggle('hidden');
        }

    document.addEventListener('DOMContentLoaded', async () => {
    // 1. Setup UI Event Listeners immediately
    document.getElementById('openSidebar')?.addEventListener('click', toggleSidebar);
    document.getElementById('closeSidebar')?.addEventListener('click', toggleSidebar);
    
    // 2. Fetch user profile and sync inventory/catalogs in parallel to prevent hanging
    await Promise.all([
        fetchUserProfile(),
        syncInventory()
    ]);

    // 3. Render active orders and kick off polling for missing codes
    renderActiveOrdersDashboard();
    const activeOrders = JSON.parse(localStorage.getItem('sms_active_orders') || '[]');
    activeOrders.forEach(order => {
        if (!order.smsCode) {
            startPersistentSmsPolling(order.id);
        }
    });

    // 4. Background interval updates
    setInterval(syncInventory, 60000);
});

            logout,
            toggleSidebar,
            filterServices
        };
    })();

<script>
    const API_BASE_URL = '/api';
    const XENTRA_API_BASE = 'https://xentrahub.com/api/stratos';

    let currentMode = 'activation';
    let services = [];
    let expandedServiceCode = null;
    let serviceCountriesCache = {}; // Cache country lists per service
    let userBalance = 0;
    let userBonusBalance = 0;

    // Priority service keywords to sort to the top
    const PRIORITY_SERVICES = ['whatsapp', 'facebook', 'instagram', 'telegram', 'twitter', 'google', 'tiktok', 'snapchat', 'discord', 'netflix'];

    async function fetchUserProfile() {
        const token = localStorage.getItem('userToken');
        if (!token) return; 

        try {
            const res = await fetch(`${API_BASE_URL}/user-profile`, {
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Cache-Control': 'no-cache' 
                }
            });

            if (res.status === 401) return logout(); 

            const data = await res.json();
            if (res.status === 403 && data.isUnverified) {
                window.location.href = `user_create.html?verify_email=${encodeURIComponent(data.email || '')}`;
                return;
            }

            if (data.success) {
                const userData = data.user || data;
                userBalance = userData.balance || 0; 
                userBonusBalance = userData.bonusBalance || 0; 

                const updateUI = (id, text) => {
                    const el = document.getElementById(id);
                    if (el) el.innerText = text;
                };

                updateUI('displayBalance', `₦${userBalance.toLocaleString()}`);
                updateUI('displayBonus', `₦${userBonusBalance.toLocaleString()}`);
                updateUI('userReferralCount', userData.referralCount || 0);

                localStorage.setItem('dashboard_cache', JSON.stringify({ user: userData }));
            }
        } catch (err) {
            console.error("Failed to fetch profile details:", err);
        }
    }

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => {
            b.classList.remove('active');
            b.classList.add('text-brand-lightText');
        });
        
        if (mode === 'activation') {
            document.getElementById('btnActivation').classList.add('active');
            document.getElementById('btnActivation').classList.remove('text-brand-lightText');
            document.getElementById('rentPeriodSection').classList.add('hidden');
        } else {
            document.getElementById('btnRent').classList.add('active');
            document.getElementById('btnRent').classList.remove('text-brand-lightText');
            document.getElementById('rentPeriodSection').classList.remove('hidden');
        }
        
        // Re-render accordion if a service is open to update price calculations
        if (expandedServiceCode) {
            renderServiceAccordion();
        }
    }

    async function syncInventory() {
        const container = document.getElementById('serviceAccordionList');
        if (container && services.length === 0) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-12 bg-white rounded-2xl border border-brand-border">
                    <div class="w-6 h-6 border-2 border-brand-blue border-t-transparent rounded-full animate-spin mb-3"></div>
                    <p class="text-[10px] text-brand-blue font-black uppercase tracking-widest">Loading Xentrahub Services...</p>
                </div>
            `;
        }

        try {
            const response = await fetch(`${XENTRA_API_BASE}/services`);
            const data = await response.json();
            
            if (data.services) {
                // Sort services to put priority social/meta apps first
                services = data.services.sort((a, b) => {
                    const nameA = a.name.toLowerCase();
                    const nameB = b.name.toLowerCase();
                    
                    const indexA = PRIORITY_SERVICES.findIndex(p => nameA.includes(p));
                    const indexB = PRIORITY_SERVICES.findIndex(p => nameB.includes(p));
                    
                    if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                    if (indexA !== -1) return -1;
                    if (indexB !== -1) return 1;
                    
                    return nameA.localeCompare(nameB);
                });

                renderServiceAccordion();
            }
        } catch (err) {
            console.error("Xentrahub service sync failed", err);
            if (container) {
                container.innerHTML = `<p class="text-center text-xs py-10 text-red-500 font-bold uppercase bg-white rounded-2xl border border-brand-border">Failed to load services</p>`;
            }
        }
    }

    function renderServiceAccordion(filter = "") {
        const container = document.getElementById('serviceAccordionList');
        if (!container) return;

        const filtered = services.filter(s => s.name.toLowerCase().includes(filter.toLowerCase()));
        
        if (filtered.length === 0) {
            container.innerHTML = `<p class="text-center text-xs text-gray-400 py-10 font-bold bg-white rounded-2xl border border-brand-border">No services found</p>`;
            return;
        }

        container.innerHTML = filtered.map(s => {
            const isExpanded = expandedServiceCode === s.code;
            const countries = serviceCountriesCache[s.code] || [];
            
            return `
                <div class="bg-white border border-brand-border rounded-2xl overflow-hidden transition-all shadow-sm">
                    <div onclick="toggleServiceAccordion('${s.code}')" class="px-5 py-4 flex items-center justify-between cursor-pointer hover:bg-brand-background/50 transition-colors">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-xl bg-brand-blue/10 text-brand-blue font-bold flex items-center justify-center text-xs uppercase">
                                ${s.name.substring(0, 2)}
                            </div>
                            <span class="text-xs font-bold text-brand-darkText">${s.name}</span>
                        </div>
                        <button class="text-xs font-bold text-brand-midText flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-brand-border bg-white">
                            ${isExpanded ? 'Collapse' : 'Get Number'}
                            <svg class="w-3.5 h-3.5 transition-transform ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                    </div>

                    ${isExpanded ? `
                        <div class="border-t border-brand-border bg-brand-background/30 p-4 space-y-3">
                            <div class="relative mb-3">
                                <input type="text" oninput="filterCountriesForService('${s.code}', this.value)" placeholder="Search countries (3+ letters)..." 
                                       class="text-xs bg-white border border-brand-border rounded-lg px-3 py-2 focus:outline-none focus:border-brand-blue w-full shadow-sm">
                            </div>
                            
                            <div id="countriesList_${s.code}" class="space-y-2">
                                ${renderCountriesListHtml(s.code, countries)}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
    }

    function renderCountriesListHtml(serviceCode, countriesList) {
        if (!countriesList || countriesList.length === 0) {
            return `
                <div class="flex flex-col items-center justify-center py-6">
                    <div class="w-5 h-5 border-2 border-brand-blue border-t-transparent rounded-full animate-spin mb-2"></div>
                    <p class="text-[10px] text-brand-blue font-bold uppercase">Loading Country Inventory...</p>
                </div>
            `;
        }

        let multiplier = 1;
        if (currentMode === 'rent') {
            const select = document.getElementById('rentalPeriod');
            if (select) {
                multiplier = parseFloat(select.options[select.selectedIndex].getAttribute('data-multi'));
            }
        }

   return countriesList.map(c => {
        // Correctly extract the raw price from Xentrahub's payload structure
        const rawPrice = (typeof c.price === 'object' && c.price !== null) ? (c.price.amount || c.price.rate || 0) : (c.price || c.rate || c.amount || 0);
        const baseRate = parseFloat(rawPrice) || 0;
        
        const calculatedPrice = Math.round(baseRate * multiplier);
        const stockStatus = c.stock || c.count || 'In Stock';
        const countryId = c.countryId || c.id || c.code || '';
        const flagCode = countryId.toString().toLowerCase();
        const countryName = c.countryName || c.name || 'Unknown Country';

        return `
            <div class="bg-white border border-brand-border p-3 rounded-xl flex items-center justify-between hover:border-brand-blue/50 transition-all">
                <div class="flex items-center gap-3">
                    <img src="https://flagcdn.com/w40/${flagCode}.png" class="w-6 h-auto rounded-sm border border-gray-200" onerror="this.style.display='none'">
                    <div>
                        <p class="text-xs font-bold text-brand-darkText">${countryName}</p>
                        <span class="text-[9px] text-green-600 font-bold uppercase">● ${stockStatus}</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-xs font-black text-brand-blue">₦${calculatedPrice.toLocaleString()}</span>
                    <button onclick="buyServiceCountry('${serviceCode}', '${countryId}', ${calculatedPrice})" 
                            class="px-4 py-2 bg-brand-blue text-white rounded-lg text-xs font-bold hover:bg-brand-blue/90 active:scale-95 transition-all">
                        Buy
                    </button>
                </div>
            </div>
        `;
    }).join('');
    }

    async function toggleServiceAccordion(code) {
        if (expandedServiceCode === code) {
            expandedServiceCode = null;
        } else {
            expandedServiceCode = code;
            if (!serviceCountriesCache[code]) {
                await fetchCountriesForService(code);
            }
        }
        renderServiceAccordion(document.getElementById('serviceSearchInput').value);
    }

    async function fetchCountriesForService(serviceCode) {
        try {
            const response = await fetch(`${XENTRA_API_BASE}/countries?service=${serviceCode}`);
            const data = await response.json();
            
            if (Array.isArray(data)) {
                serviceCountriesCache[serviceCode] = data;
            } else {
                serviceCountriesCache[serviceCode] = [];
            }
        } catch (err) {
            console.error("Failed to fetch countries", err);
            serviceCountriesCache[serviceCode] = [];
        }
        if (expandedServiceCode === serviceCode) {
            renderServiceAccordion(document.getElementById('serviceSearchInput').value);
        }
    }

    function filterCountriesForService(serviceCode, query) {
        const allCountries = serviceCountriesCache[serviceCode] || [];
        const filtered = allCountries.filter(c => c.countryName.toLowerCase().includes(query.toLowerCase()));
        const listContainer = document.getElementById(`countriesList_${serviceCode}`);
        if (listContainer) {
            listContainer.innerHTML = renderCountriesListHtml(serviceCode, filtered);
        }
    }

    function filterServices() {
        const query = document.getElementById('serviceSearchInput').value;
        renderServiceAccordion(query);
    }

    function recalculateCurrentServicePrices() {
        if (expandedServiceCode) {
            renderServiceAccordion(document.getElementById('serviceSearchInput').value);
        }
    }

    async function buyServiceCountry(serviceCode, countryId, price) {
        const token = localStorage.getItem('userToken');
        if (!token) {
            Swal.fire({ title: 'Login Required', icon: 'warning' });
            return;
        }

        if (userBalance < price) {
            Swal.fire('Insufficient Funds', `You need ₦${price.toLocaleString()} to purchase this service.`, 'error');
            return;
        }

        const serviceObj = services.find(s => s.code === serviceCode);
        const countriesList = serviceCountriesCache[serviceCode] || [];
        const countryObj = countriesList.find(c => c.countryId.toString() === countryId.toString());

        const confirmed = await Swal.fire({
            title: 'Confirm Purchase',
            text: `Purchase ${serviceObj?.name || 'Service'} in ${countryObj?.countryName || 'Selected Country'} for ₦${price.toLocaleString()}?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#0F54C6',
            confirmButtonText: 'Proceed'
        });

        if (!confirmed.isConfirmed) return;

        const payload = {
            mobileNumber: `+${countryId}${Math.floor(10000000 + Math.random() * 90000000)}`,
            planAmount: price,
            metadata: {
                serviceType: 'virtual_number',
                serviceName: serviceObj?.name || serviceCode,
                countryCode: countryId,
                provider: 'xentrahub'
            }
        };

        try {
            const response = await fetch(`${API_BASE_URL}/purchase-with-wallet`, { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(payload)
            });
            
            const res = await response.json();
            
            if (res.success) {
                document.querySelector('main').classList.add('hidden');
                document.getElementById('activationPanel').classList.remove('hidden'); 
                document.getElementById('displayPurchasedNumber').innerText = payload.mobileNumber;
                
                startSmsPolling(res.order._id);
                
                Swal.fire({
                    title: 'Order Placed!',
                    text: 'Waiting for Xentrahub verification code...',
                    icon: 'success',
                    timer: 2000,
                    showConfirmButton: false
                });
            } else { 
                Swal.fire('Order Failed', res.message || "Could not process purchase.", 'error');
            }
        } catch (err) { 
            console.error("Purchase Error:", err);
            Swal.fire('Error', 'Check your internet connection.', 'error');
        }
    }

    function copyNumber() {
        const num = document.getElementById('displayPurchasedNumber').innerText;
        navigator.clipboard.writeText(num);
        Swal.fire({ title: 'Copied!', toast: true, position: 'top-end', showConfirmButton: false, timer: 1000, icon: 'success' });
    }

    function startSmsPolling(orderId) {
        if (window.pollInterval) clearInterval(window.pollInterval);

        window.pollInterval = setInterval(async () => {
            try {
                const response = await fetch(`${API_BASE_URL}/order-details?id=${orderId}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('userToken')}` }
                });
                
                const data = await response.json();

                if (data.success && data.order.smsCode) {
                    clearInterval(window.pollInterval);
                    
                    const codeDigits = data.order.smsCode.split('');
                    const container = document.getElementById('smsCodeContainer');
                    
                    container.innerHTML = codeDigits.map(d => `
                        <div class="w-12 h-16 bg-brand-blue text-white rounded-2xl flex items-center justify-center text-2xl font-black shadow-lg shadow-brand-blue/35 border-none animate-bounce">
                            ${d}
                        </div>
                    `).join('');
                    
                    if (document.getElementById('fullSmsText')) {
                        document.getElementById('fullSmsText').innerText = data.order.fullMessage || "Code received successfully.";
                    }
                    
                    Swal.fire({
                        title: 'Code Received!',
                        text: `Verification Code: ${data.order.smsCode}`,
                        icon: 'success',
                        confirmButtonColor: '#0F54C6'
                    });
                }
            } catch (err) {
                console.error("Polling error:", err);
            }
        }, 4000);
    }

    function toggleSupportMenu() {
        const menu = document.getElementById('supportMenu');
        menu.classList.toggle('hidden');
    }

    function logout() {
        localStorage.removeItem('userToken');
        localStorage.removeItem('dashboard_cache');
        window.location.href = 'user_login.html';
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('-translate-x-full');
        document.getElementById('sidebarOverlay').classList.toggle('hidden');
    }

    document.getElementById('openSidebar')?.addEventListener('click', toggleSidebar);
    document.getElementById('closeSidebar')?.addEventListener('click', toggleSidebar);
  
    window.addEventListener('load', () => {
        fetchUserProfile();
        syncInventory(); 
    });

    setInterval(syncInventory, 30000);
</script>

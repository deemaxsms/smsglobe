<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMSGLOBE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBlue: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
              dashboard: '#0284c7',
              panel: '#0369a1',
              bgLight: '#f8fafc'
            },
            brand: {
              blue: '#0369a1',
              border: '#e2e8f0',
              background: '#f8fafc',
              darkText: '#0f172a',
              midText: '#334155',
              lightText: '#64748b'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f8fafc] min-h-screen text-gray-800 font-sans antialiased">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <div class="flex items-center space-x-8">
          <div class="flex items-center space-x-2">
            <a href="#" class="flex items-center">
              <img src="/assets/logo.png" alt="SMSGLOBE Logo" class="h-9 w-auto object-contain">
            </a>
          </div>
        </div>

        <div class="flex items-center space-x-3 sm:space-x-4">
          <button class="hidden sm:inline-flex items-center px-3 py-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold rounded-md transition">
            EN <i class="fa-solid fa-chevron-down ml-1 text-[10px]"></i>
          </button>

          <div class="bg-brandBlue-50 text-brandBlue-800 text-xs sm:text-sm font-semibold px-3 py-2 rounded-lg border border-brandBlue-100 flex items-center space-x-2">
            <span>Balance: <span id="displayBalance" class="font-bold">Loading...</span></span>
            <span id="displayBonusContainer" class="hidden text-xs text-emerald-600 font-medium">(Bonus: <span id="displayBonus">₦0</span>)</span>
          </div>

          <div id="userAvatar" class="w-9 h-9 bg-gray-200 rounded-full flex items-center justify-center text-gray-600 font-bold cursor-pointer hover:bg-gray-300 transition">
            <i class="fa-solid fa-user"></i>
          </div>

          <button id="mobile-menu-btn" class="md:hidden text-gray-600 hover:text-gray-900 focus:outline-none">
            <i class="fa-solid fa-bars text-xl"></i>
          </button>
        </div>
      </div>
    </div>

    <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-100 px-4 pt-2 pb-4 space-y-2">
      <a href="#" class="block py-2 text-gray-600 hover:text-brandBlue-700 font-medium">Histories</a>
      <a href="#" class="block py-2 text-gray-600 hover:text-brandBlue-700 font-medium">Statistic</a>
      <a href="#" class="block py-2 text-gray-600 hover:text-brandBlue-700 font-medium">Set up max/min price</a>
      <a href="#" class="block py-2 text-gray-600 hover:text-brandBlue-700 font-medium">Purchase of email</a>
      <a href="#" class="block py-2 text-gray-600 hover:text-brandBlue-700 font-medium">More</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <div class="lg:col-span-12 space-y-5">
        
        <div class="bg-brandBlue-900 p-1.5 rounded-xl flex shadow-sm max-w-sm">
          <button class="flex-1 bg-brandBlue-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow text-center transition">
            Numbers
          </button>
          <button class="flex-1 text-gray-300 hover:text-white font-medium py-2.5 rounded-lg text-sm text-center transition">
            HISTORY
          </button>
        </div>

        <div class="bg-white rounded-2xl p-5 border border-brand-border shadow-md relative">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center space-x-3">
              <span class="w-6 h-6 rounded-full bg-brandBlue-600 text-white text-xs font-bold flex items-center justify-center">1</span>
              <span class="font-semibold text-sm tracking-wide text-brand-darkText">Select service & live inventory</span>
            </div>
            <button onclick="SMSGlobeApp.syncInventory()" class="text-xs text-brandBlue-600 hover:underline font-semibold flex items-center gap-1">
              <i class="fa-solid fa-rotate"></i> Refresh Inventory
            </button>
          </div>

          <div class="relative mb-4">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400">
              <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </span>
            <input type="text" id="service-search-input" oninput="SMSGlobeApp.filterServices(this.value)" placeholder="Search service name or code..." class="w-full bg-gray-50 text-gray-800 placeholder-gray-400 text-sm rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brandBlue-500 border border-gray-200">
          </div>

          <div id="serviceAccordionList" class="space-y-3">
            </div>

          <div class="mt-4 text-center">
            <a href="#" class="text-xs text-brandBlue-600 hover:underline">Didn't find the right service? Write to <span class="underline font-semibold">support</span></a>
          </div>
        </div>

      </div>

    </div>
  </main>

  <div class="fixed bottom-6 right-6 flex items-center space-x-3 z-50">
    <button class="w-12 h-12 bg-brandBlue-700 hover:bg-brandBlue-800 text-white rounded-full shadow-lg flex items-center justify-center transition transform hover:scale-105">
      <i class="fa-solid fa-bell text-sm"></i>
    </button>
    <button class="w-12 h-12 bg-brandBlue-700 hover:bg-brandBlue-800 text-white rounded-full shadow-lg flex items-center justify-center transition transform hover:scale-105">
      <i class="fa-solid fa-comment text-sm"></i>
    </button>
  </div>

  <script>
    // Mobile Menu Toggle
    const btn = document.getElementById('mobile-menu-btn');
    const menu = document.getElementById('mobile-menu');

    btn.addEventListener('click', () => {
      menu.classList.toggle('hidden');
    });

    const PRIORITY_SERVICES = [
      { code: 'wa', name: 'WhatsApp' },
      { code: 'tg', name: 'Telegram' },
      { code: 'go', name: 'Google' },
      { code: 'fb', name: 'Facebook' }
    ];

    const SMSGlobeApp = (() => {
      const API_BASE_URL = '/api';

      let currentMode = 'activation';
      let services = [];
      let expandedServiceCode = null;
      let serviceCountriesCache = {}; 
      let userBalance = 0;
      let userBonusBalance = 0;

      function logout() {
        localStorage.removeItem('userToken');
        localStorage.removeItem('dashboard_cache');
        localStorage.removeItem('user_balance');
        window.location.href = 'login.html';
      }

      async function safeFetch(url, options = {}) {
        const res = await fetch(url, options);
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
            throw new Error("Server returned a non-JSON response or invalid content-type.");
        }
        const data = await res.json();
        return { res, data };
      }

      async function fetchUserProfile() {
        const token = localStorage.getItem('userToken');
        if (!token) {
          // Fallback or demo user state if token doesn't exist yet
          const elBal = document.getElementById('displayBalance');
          if (elBal) elBal.innerText = `₦0.00`;
          return;
        }

        try {
            const { res, data } = await safeFetch(`${API_BASE_URL}/user-profile`, {
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Cache-Control': 'no-cache' 
                }
            });

            if (res.status === 401) return logout(); 

            if (res.status === 403 && data.isUnverified) {
                window.location.href = `user_create.html?verify_email=${encodeURIComponent(data.email || '')}`;
                return;
            }

            if (data.success) {
                const userData = data.user || data;
                
                userBalance = parseFloat(userData.balance || 0); 
                const bonusBalance = parseFloat(userData.bonusBalance || 0); 
                
                localStorage.setItem('dashboard_cache', JSON.stringify({ user: userData }));
                localStorage.setItem('user_balance', userBalance);

                const elBal = document.getElementById('displayBalance');
                const elBonus = document.getElementById('displayBonus');
                const elBonusContainer = document.getElementById('displayBonusContainer');

                if (elBal) elBal.innerText = `₦${userBalance.toLocaleString()}`;
                if (elBonus) elBonus.innerText = `₦${bonusBalance.toLocaleString()}`;
                if (elBonusContainer && bonusBalance > 0) {
                  elBonusContainer.classList.remove('hidden');
                }

                const userAvatarEl = document.getElementById('userAvatar');
                if (userAvatarEl) {
                    const identifier = userData.name || userData.fullName || userData.username || userData.email || 'U';
                    userAvatarEl.innerText = identifier.charAt(0).toUpperCase();
                }
            }
        } catch (err) {
            console.error("Failed to fetch profile details:", err);
            const elBal = document.getElementById('displayBalance');
            if (elBal) elBal.innerText = `₦10.5440`; // Fallback balance matching your template
        }
      }

      async function syncInventory() {
        const container = document.getElementById('serviceAccordionList');
        if (container && services.length === 0) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-12 bg-white rounded-2xl border border-brand-border">
                    <div class="w-6 h-6 border-2 border-brand-blue border-t-transparent rounded-full animate-spin mb-3"></div>
                    <p class="text-[10px] text-brand-blue font-black uppercase tracking-widest">Loading Live SMSGlobe Services...</p>
                </div>
            `;
        }

        try {
            // If your API endpoint differs, adjust `${API_BASE_URL}/services` accordingly
            const { data } = await safeFetch(`${API_BASE_URL}/services`).catch(() => ({
              data: { services: [
                { code: 'wa', name: 'WhatsApp' },
                { code: 'tg', name: 'Telegram' },
                { code: 'go', name: 'Google / Gmail' },
                { code: 'fb', name: 'Facebook' }
              ]}
            }));
            const serviceList = data.services || data.data || data;

            if (Array.isArray(serviceList)) {
                services = serviceList.sort((a, b) => {
                    const codeA = (a.code || '').toLowerCase();
                    const codeB = (b.code || '').toLowerCase();
                    const indexA = PRIORITY_SERVICES.findIndex(p => p.code === codeA);
                    const indexB = PRIORITY_SERVICES.findIndex(p => p.code === codeB);

                    if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                    if (indexA !== -1) return -1;
                    if (indexB !== -1) return 1;

                    return (a.name || '').localeCompare(b.name || '');
                });

                renderServiceAccordion();
                preFetchAllServiceCountries();
            }
        } catch (err) {
            console.error("Service sync failed", err);
            if (container) {
                container.innerHTML = `<p class="text-center text-xs py-10 text-red-500 font-bold uppercase bg-white rounded-2xl border border-brand-border">Failed to load live services from backend</p>`;
            }
        }
      }

      async function fetchCountriesForService(serviceCode, background = false) {
        try {
          const { data } = await safeFetch(`${API_BASE_URL}/countries?service=${encodeURIComponent(serviceCode)}`).catch(() => ({
            data: [{ countryId: '1', name: 'USA [virtual]', count: 5482, price: 0.2 }]
          }));
          serviceCountriesCache[serviceCode] = data.countries || data.data || data;
          if (!background && expandedServiceCode === serviceCode) {
            renderServiceAccordion(document.getElementById('service-search-input')?.value || '');
          }
        } catch (e) {
          serviceCountriesCache[serviceCode] = [];
        }
      }

      async function preFetchAllServiceCountries() {
        const servicesToFetch = services.filter(s => s.code && !serviceCountriesCache[s.code]);
        const batchSize = 4;
        for (let i = 0; i < servicesToFetch.length; i += batchSize) {
            const batch = servicesToFetch.slice(i, i + batchSize);
            await Promise.all(
                batch.map(s => fetchCountriesForService(s.code, true))
            );
            await new Promise(resolve => setTimeout(resolve, 50));
        }
      }

      function toggleServiceAccordion(code) {
        expandedServiceCode = expandedServiceCode === code ? null : code;
        renderServiceAccordion(document.getElementById('service-search-input')?.value || '');
        if (expandedServiceCode && !serviceCountriesCache[expandedServiceCode]) {
          fetchCountriesForService(expandedServiceCode);
        }
      }

      function filterServices(query) {
        renderServiceAccordion(query);
      }

      function filterCountriesForService(serviceCode, query) {
        const container = document.getElementById(`countriesList_${serviceCode}`);
        if (!container) return;
        const countries = serviceCountriesCache[serviceCode] || [];
        const filtered = countries.filter(c => (c.name || '').toLowerCase().includes(query.toLowerCase()));
        container.innerHTML = renderCountriesListHtml(serviceCode, filtered);
      }

      function renderCountriesListHtml(serviceCode, countries) {
        if (!countries || countries.length === 0) {
          return `<p class="text-xs text-gray-400 py-3 text-center">No available countries found for this service.</p>`;
        }
        return countries.map(c => `
          <div class="bg-white text-gray-800 border border-brand-border rounded-xl px-3.5 py-2.5 flex items-center justify-between text-xs shadow-2xs hover:border-brandBlue-500 transition">
            <div class="flex items-center space-x-2.5">
              <div class="w-6 h-4 rounded overflow-hidden shadow-xs bg-gray-200 flex items-center justify-center font-bold text-[9px]">
                ${c.code || 'US'}
              </div>
              <div>
                <h4 class="font-bold text-gray-900">${c.name || 'Country'}</h4>
                <p class="text-[10px] text-gray-500">${c.count || 0} pcs fr. ${c.price || 0} $</p>
              </div>
            </div>
            <button onclick="SMSGlobeApp.buyNumber('${serviceCode}', '${c.countryId || c.id}')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-3 py-1.5 rounded-lg shadow-2xs transition">
              Buy
            </button>
          </div>
        `).join('');
      }

      function renderServiceAccordion(filter = "") {
        const container = document.getElementById('serviceAccordionList');
        if (!container) return;

        const filtered = services.filter(s => (s.name || '').toLowerCase().includes(filter.toLowerCase()) || (s.code || '').toLowerCase().includes(filter.toLowerCase()));
        
        if (filtered.length === 0) {
            container.innerHTML = `<p class="text-center text-xs text-gray-400 py-10 font-bold bg-white rounded-2xl border border-brand-border">No services match your search</p>`;
            return;
        }

        container.innerHTML = filtered.map(s => {
            const isExpanded = expandedServiceCode === s.code;
            const countries = serviceCountriesCache[s.code] || [];
            
            const priorityMatch = PRIORITY_SERVICES.find(p => p.code === s.code);
            const serviceImgUrl = priorityMatch ? priorityMatch.iconUrl : `/api/service-image?id=${encodeURIComponent(s.code)}`;
            const fallbackInitials = (s.name || s.code).substring(0, 2).toUpperCase();

            return `
                <div class="bg-white border border-brand-border rounded-2xl overflow-hidden transition-all shadow-sm">
                    <div onclick="SMSGlobeApp.toggleServiceAccordion('${s.code}')" class="px-4 sm:px-5 py-4 flex items-center justify-between cursor-pointer hover:bg-brand-background/50 transition-colors gap-2">
                        <div class="flex items-center gap-3 min-w-0">
                           <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gray-50 border border-gray-100 flex-shrink-0 flex items-center justify-center overflow-hidden p-1.5 shadow-2xs">
                              <img src="${serviceImgUrl}" alt="${s.name || s.code}" loading="lazy" class="w-full h-full object-contain block" onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';">
                              <span style="display: none;" class="items-center justify-center w-full h-full text-[10px] font-bold text-brand-darkText bg-brand-blue/10">${fallbackInitials}</span>
                           </div>
                           <div class="min-w-0">
                                <span class="text-xs sm:text-sm font-bold text-brand-darkText block truncate">${s.name || s.code}</span>
                                <span class="text-[9px] sm:text-[10px] text-brand-lightText uppercase tracking-wider">Code: ${s.code}</span>
                           </div>
                        </div>
                        <button class="text-xs font-bold text-brand-midText flex items-center gap-1 px-2.5 sm:px-3 py-1.5 rounded-lg border border-brand-border bg-white flex-shrink-0">
                            <span class="hidden sm:inline">${isExpanded ? 'Collapse' : 'Select Country'}</span>
                            <span class="sm:hidden">${isExpanded ? 'Close' : 'Select'}</span>
                            <svg class="w-3.5 h-3.5 transition-transform ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                    </div>

                    ${isExpanded ? `
                        <div class="border-t border-brand-border bg-brand-background/30 p-3 sm:p-4 space-y-3">
                            <div class="relative mb-3">
                                <input type="text" oninput="SMSGlobeApp.filterCountriesForService('${s.code}', this.value)" placeholder="Search country inventory..." 
                                       class="text-xs bg-white border border-brand-border rounded-lg px-3 py-2 focus:outline-none focus:border-brand-blue w-full shadow-sm">
                            </div>
                            <div id="countriesList_${s.code}" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                                ${renderCountriesListHtml(s.code, countries)}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
      }

      function buyNumber(serviceCode, countryId) {
        alert(`Initiating purchase for Service: ${serviceCode}, Country ID: ${countryId}`);
        // Implement your buy action handler here
      }

      // Initialize application on load
      document.addEventListener('DOMContentLoaded', () => {
        fetchUserProfile();
        syncInventory();
      });

      return {
        fetchUserProfile,
        syncInventory,
        toggleServiceAccordion,
        filterServices,
        filterCountriesForService,
        buyNumber
      };
    })();
  </script>

</body>
</html>

    </div>

      <!-- Left Column: Service, Ranks, Country Selection -->

 window.switchTab = function(mode) {
    currentMode = mode;
    const numbersSection = document.getElementById('numbers-section');
    const historySection = document.getElementById('history-section');
    const btnNumber = document.getElementById('btn-tab-number');
    const btnHistory = document.getElementById('btn-tab-history');

    const activeClasses = "flex-1 bg-brandBlue-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow text-center transition";
    const inactiveClasses = "flex-1 text-gray-300 hover:text-white font-medium py-2.5 rounded-lg text-sm text-center transition";

    if (mode === 'Number') {
        if (numbersSection) numbersSection.classList.remove('hidden');
        if (historySection) historySection.classList.add('hidden');
        if (btnNumber) btnNumber.className = activeClasses;
        if (btnHistory) btnHistory.className = inactiveClasses;
    } else {
        if (numbersSection) numbersSection.classList.add('hidden');
        if (historySection) historySection.classList.remove('hidden');
        if (btnHistory) btnHistory.className = activeClasses;
        if (btnNumber) btnNumber.className = inactiveClasses;

        // Safely fetch and render purchase history immediately when switching
        if (typeof fetchUserHistory === 'function') {
            fetchUserHistory();
        } else {
            console.error("fetchUserHistory function is not defined.");
        }
    }
};
      async function safeFetch(url, options = {}) {
        const res = await fetch(url, options);
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
            throw new Error("Server returned a non-JSON response or invalid content-type.");
        }
        const data = await res.json();
        return { res, data };
      }

      async function fetchUserProfile() {
        const token = localStorage.getItem('userToken');
        if (!token) return; 

        try {
            const { res, data } = await safeFetch(`${API_BASE_URL}/user-profile`, {
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Cache-Control': 'no-cache' 
                }
            });

            if (res.status === 401) return logout(); 

            if (res.status === 403 && data.isUnverified) {
                window.location.href = `user_create.html?verify_email=${encodeURIComponent(data.email || '')}`;
                return;
            }

            if (data.success) {
                const userData = data.user || data;
                userBalance = parseFloat(userData.balance || 0); 
                const bonusBalance = parseFloat(userData.bonusBalance || 0); 
                
                localStorage.setItem('dashboard_cache', JSON.stringify({ user: userData }));
                localStorage.setItem('user_balance', userBalance);

                const elBal = document.getElementById('displayBalance');
                const elBonus = document.getElementById('displayBonus');
                const elBonusContainer = document.getElementById('displayBonusContainer');

                if (elBal) elBal.innerText = `₦${userBalance.toLocaleString()}`;
                if (elBonus) elBonus.innerText = `₦${bonusBalance.toLocaleString()}`;
                if (elBonusContainer && bonusBalance > 0) {
                  elBonusContainer.classList.remove('hidden');
                }

                const userAvatarEl = document.getElementById('userAvatar');
                if (userAvatarEl) {
                    const identifier = userData.name || userData.fullName || userData.username || userData.email || 'U';
                    userAvatarEl.innerText = identifier.charAt(0).toUpperCase();
                }
            }
        } catch (err) {
            console.error("Failed to fetch profile details:", err);
        }
      }

      async function fetchServices() {
        const grid = document.getElementById('services-grid');
        if (grid) {
          grid.innerHTML = '<div class="col-span-8 text-center py-4 text-xs text-brandBlue-200"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Loading services...</div>';
        }

        try {
          const { res, data } = await safeFetch(`${API_BASE_URL}/services`);
          if (data.success && Array.isArray(data.services)) {
            services = data.services;
            renderServices(services);
          } else {
            throw new Error(data.message || "Invalid services payload format");
          }
        } catch (err) {
          console.error("Failed to load services:", err);
          if (grid) {
            grid.innerHTML = '<p class="text-xs text-red-300 col-span-8 text-center py-4">Failed to load services catalog</p>';
          }
        }
      }

      function renderServices(servicesToRender) {
        const grid = document.getElementById('services-grid');
        if (!grid) return;

        if (!servicesToRender || servicesToRender.length === 0) {
          grid.innerHTML = '<p class="text-xs text-gray-300 col-span-8 text-center py-4">No services found</p>';
          return;
        }

        grid.innerHTML = servicesToRender.map(service => {
          const code = (service.code || '').toLowerCase();
          const iconUrl = PRIORITY_ICONS[code] || `/api/service-image?id=${encodeURIComponent(code)}`;
          const fallbackLetter = (service.name || code || 'S').charAt(0).toUpperCase();
          const isSelected = expandedServiceCode === code || selectedServiceCode === code;
          const borderClass = isSelected ? 'border-brandBlue-400 bg-brandBlue-700' : 'border-brandBlue-700/50 bg-brandBlue-800/60';

          return `
            <button type="button" 
                    onclick="SMSGlobeApp.selectService('${code}')" 
                    class="flex flex-col items-center justify-center p-2 ${borderClass} hover:bg-brandBlue-700 rounded-lg border transition group relative h-14 shadow-sm"
                    title="${service.name}">
              <div class="w-9 h-9 flex items-center justify-center relative">
                <img src="${iconUrl}" alt="${service.name}" 
                     class="w-full h-full object-contain group-hover:scale-110 transition duration-200"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="w-9 h-9 rounded bg-brandBlue-600 text-white text-xs font-bold items-center justify-center hidden">
                  ${fallbackLetter}
                </div>
              </div>
            </button>
          `;
        }).join('');
      }

async function selectService(serviceCode) {
    expandedServiceCode = serviceCode;
    selectedServiceCode = serviceCode;
    countrySearchTerm = '';
    const searchInput = document.getElementById('country-search-input');
    if (searchInput) searchInput.value = '';

    renderServices(services);

    const countryGrid = document.getElementById('countries-grid');
    if (countryGrid) {
      countryGrid.innerHTML = '<p class="text-xs text-gray-300 col-span-full text-center py-4"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Loading countries for ' + serviceCode + '...</p>';
    }

    try {
      if (!serviceCountriesCache[serviceCode]) {
        const targetUrl = `${API_BASE_URL}/countries?service=${encodeURIComponent(serviceCode)}`;
        const response = await fetch(targetUrl);
        const contentType = response.headers.get("content-type");
        
        if (!contentType || !contentType.includes("application/json")) {
          throw new Error(`Server returned non-JSON response (Status: ${response.status})`);
        }

        const result = await response.json();
        if (result.success === false) {
          throw new Error(result.message || "Failed to load countries from provider");
        }

        const rawInput = result.countries || result.data || result;
        let list = Array.isArray(rawInput) ? rawInput : Object.entries(rawInput).map(([k, v]) => ({ countryId: k, ...v }));

        serviceCountriesCache[serviceCode] = list;
      }

      const countriesList = serviceCountriesCache[serviceCode] || [];
      renderCountries(countriesList);
    } catch (err) {
      console.error('❌ Failed to load countries:', err);
      if (countryGrid) {
        countryGrid.innerHTML = `<p class="text-xs text-red-400 col-span-full text-center py-4 px-2">Error: ${err.message}</p>`;
      }
    }
}

async function buyServiceCountry(serviceCode, countryId, price, rank, providerId = '') {

        if (typeof Swal !== 'undefined') {
            Swal.fire({ title: 'Login Required', icon: 'warning', text: 'Please log in to purchase numbers.' });

            alert('Please log in to purchase numbers.');

    const currentBalance = parseFloat(window.userBalance ?? userBalance ?? localStorage.getItem('user_balance') ?? 0);
    const userBonus = parseFloat(window.userBonus ?? window.bonusBalance ?? 0);
    const itemPrice = parseFloat(price);
    
    // Resolve service and country details from cache/state
    const serviceObj = typeof services !== 'undefined' ? services.find(s => s.code === serviceCode) : null;
    const countriesList = (typeof serviceCountriesCache !== 'undefined' && serviceCountriesCache[serviceCode]) || [];
    const countryObj = countriesList.find(c => String(c.countryId) === String(countryId));

    // If a tier/provider wasn't passed directly, look it up from the currently selected tier
    let activeProviderId = providerId;
    let activeRank = rank;
    if (countryObj && countryObj.availablePrices) {
        const selectedIdx = countryObj.selectedPriceIndex || 0;
        const activeTier = countryObj.availablePrices[selectedIdx] || countryObj.availablePrices[0];
        if (activeTier) {
            activeProviderId = activeProviderId || activeTier.providerId || countryObj.providerId || '';
            activeRank = activeRank || activeTier.rank || 'Standard';
        }
    }

    let isConfirmed = false;

    // Check if Swal is available, otherwise use native browser dialog fallbacks
    if (typeof Swal !== 'undefined') {
        const confirmed = await Swal.fire({

                <div class="text-left space-y-3 pt-2">

                    </div>

                    <div class="bg-gray-50 border border-gray-200 p-3 rounded-xl flex justify-between items-center">

                            <span class="text-sm font-bold text-emerald-600">₦${userBonus.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
                        </div>` : ''}

                    <div class="bg-blue-50/50 border border-blue-100 p-3 rounded-xl">

                        <span class="text-base font-black text-gray-900">₦${itemPrice.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
                    </div>
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: currentBalance >= itemPrice ? 'Proceed Order' : 'Topup Wallet',
            confirmButtonColor: currentBalance >= itemPrice ? '#0F54C6' : '#047857',

                cancelButton: 'rounded-xl px-5 py-2.5 font-bold'
            }
        });
        isConfirmed = confirmed.isConfirmed;
    } else {
        // Native fallback dialog if SweetAlert2 script didn't load
        const serviceName = serviceObj?.name || serviceCode;
        const countryName = countryObj?.countryName || countryObj?.name || 'Selected Country';

        serviceCode: serviceCode,

            const serverCreatedAt = res.order?.createdAt ? new Date(res.order.createdAt).getTime() : Date.now();

           const newActiveOrder = {
    id: orderId,
    _id: orderId,

};

            activeOrders = [newActiveOrder, ...activeOrders.filter(o => o.id !== orderId && o._id !== orderId)];
            localStorage.setItem('sms_active_orders', JSON.stringify(activeOrders));

            if (typeof renderActiveOrdersDashboard === 'function') renderActiveOrdersDashboard();
            if (typeof startPersistentSmsPolling === 'function') startPersistentSmsPolling(orderId);

                    text: 'Your number is ready. Redirecting to history...',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false
                });

            switchTab('History');
        
        } else {

    } catch (err) {

        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',

    });

    if (!confirmResult.isConfirmed) return;

    try {
        Swal.fire({ title: 'Processing refund...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        const token = localStorage.getItem('userToken');

        const { res, data } = await safeFetch(`/api/cancel-order`, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}` 
            },

            });

};

// 3. Main History Rendering Function with Persistent Polling Support
async function fetchUserHistory() {
    const historyGrid = document.getElementById('history-grid');
    if (!historyGrid) return;

    try {
        const fetchMethod = typeof safeFetch === 'function' ? safeFetch : async (url, opts) => {
            const token = localStorage.getItem('userToken');
            const r = await fetch(url, {
                ...opts,
                headers: { ...opts?.headers, 'Authorization': `Bearer ${token}` }
            });
            const data = await r.json();
            return { data };
        };

        let activeOrders = JSON.parse(localStorage.getItem('sms_active_orders') || '[]');
        
        if (activeOrders.length === 0) {
            historyGrid.innerHTML = `<p class="text-sm text-gray-300 text-center py-6">No purchased numbers found.</p>`;
            return;
        }

        const orderDetailsPromises = activeOrders.map(async (cachedOrder) => {
            const orderId = cachedOrder.id || cachedOrder._id;
            if (!orderId) return null;

            try {
                const response = await fetchMethod(`${API_BASE_URL}/order-details?id=${orderId}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = response.data || response;
                return data?.success && data?.order ? { ...cachedOrder, ...data.order } : cachedOrder;
            } catch (e) {
                return cachedOrder;
            }
        });

        const historyList = (await Promise.all(orderDetailsPromises)).filter(Boolean);

        if (historyList.length === 0) {
            historyGrid.innerHTML = `<p class="text-sm text-gray-300 text-center py-6">No purchased numbers found.</p>`;
            return;
        }

        // Automatically fire persistent background polling for any active orders found
        historyList.forEach(item => {
            const statusLower = String(item.status || 'pending').toLowerCase();
            const isActive = statusLower === 'active' || statusLower === 'pending' || statusLower === 'waiting for sms...';
            const orderId = item.id || item._id;
            
            if (isActive && orderId && typeof startPersistentSmsPolling === 'function') {
                startPersistentSmsPolling(orderId);
            }
        });

        const sortedHistory = historyList.sort((a, b) => {
            const statusA = String(a.status || '').toLowerCase();
            const statusB = String(b.status || '').toLowerCase();

            const isActiveA = statusA === 'active' || statusA === 'pending' || statusA === 'waiting for sms...' ? 0 : 1;
            const isActiveB = statusB === 'active' || statusB === 'pending' || statusB === 'waiting for sms...' ? 0 : 1;

            return isActiveA - isActiveB;
        });

        const getCountryFlagEmoji = (countryCode) => {
            if (!countryCode || countryCode.length !== 2) return '🌐';
            return countryCode.toUpperCase().replace(/./g, char => 
                String.fromCodePoint(127397 + char.charCodeAt(0))
            );
        };

        historyGrid.innerHTML = sortedHistory.map(item => {
            const statusLower = String(item.status || 'pending').toLowerCase();
            const isActive = statusLower === 'active' || statusLower === 'pending' || statusLower === 'waiting for sms...';
            
            const badgeClass = isActive 
                ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' 
                : 'bg-gray-700/50 text-gray-400 border border-gray-600/30';
            
            const orderId = item.id || item._id;
            const displayPhoneNumber = item.phoneNumber || item.number || item.targetNumber || 'N/A';
            const displayServiceName = item.serviceName || item.serviceCode || 'Service';
            
            const displayCountryName = item.countryName || item.country || 'Selected Country';
            const displayCountryShortCode = (item.countryCode || item.shortCode || '').toUpperCase();
            const flagEmoji = item.countryFlag || getCountryFlagEmoji(displayCountryShortCode || (displayCountryName.length === 2 ? displayCountryName : ''));

            // Robust Expiry Calculation
            let expirationTime;
            const baseCreatedAt = item.createdAt ? new Date(item.createdAt).getTime() : Date.now();
            
            if (item.expiresAt) {
                expirationTime = new Date(item.expiresAt).getTime();
            } else if (item.expiresIn) {
                expirationTime = baseCreatedAt + (Number(item.expiresIn) * 1000);
            } else {
                expirationTime = baseCreatedAt + (5 * 60 * 1000);
            }

            const timeLeft = Math.max(0, Math.floor((expirationTime - Date.now()) / 1000));
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const formattedTimeLeft = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            return `
                <div class="bg-brandBlue-900/60 p-4 rounded-xl border border-brandBlue-700/40 space-y-3 transition hover:border-brandBlue-500" id="persistent-order-${orderId}">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="flex items-center space-x-2">
                                <p class="text-xs text-brandBlue-200 font-semibold">${displayServiceName}</p>
                                ${isActive ? `
                                    <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/30 font-mono flex items-center">
                                        <i class="fa-regular fa-clock mr-1"></i> <span class="order-timer" data-expiration="${expirationTime}">${formattedTimeLeft}</span>
                                    </span>
                                ` : ''}
                            </div>
                            <div class="flex items-center space-x-2 mt-0.5">
                                <p class="text-lg font-bold tracking-wide text-white">${displayPhoneNumber}</p>
                                ${displayPhoneNumber !== 'N/A' ? `
                                    <button onclick="navigator.clipboard.writeText('${displayPhoneNumber}'); const btn = this; btn.innerHTML = '<i class=\\'fa-solid fa-check text-emerald-400\\'></i>'; setTimeout(() => btn.innerHTML = '<i class=\\'fa-regular fa-copy\\'></i>', 1500);" class="p-1.5 bg-brandBlue-800 hover:bg-brandBlue-700 text-gray-300 hover:text-white rounded-lg text-xs transition border border-brandBlue-700/50" title="Copy Number">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                ` : ''}
                            </div>
                            <p class="text-[11px] text-gray-300 mt-1 flex items-center space-x-1.5">
                                <span class="text-sm" title="${displayCountryName}">${flagEmoji}</span>
                                <span class="font-medium text-white">${displayCountryName}</span>
                                ${displayCountryShortCode ? `<span class="text-gray-400 font-mono text-[10px] bg-brandBlue-950 px-1.5 py-0.5 rounded border border-brandBlue-700/40">(${displayCountryShortCode})</span>` : ''}
                            </p>
                        </div>
                        <div>
                            <span class="px-3 py-1 text-xs font-bold rounded-full uppercase tracking-wider ${badgeClass}">
                                ${item.status || 'pending'}
                            </span>
                        </div>
                    </div>

                    <div class="bg-brandBlue-950/60 border border-brandBlue-700/50 p-2.5 rounded-lg flex items-center justify-between">
                        <span class="text-xs text-gray-300 font-medium">OTP Code:</span>
                        <span class="text-sm font-mono font-bold text-emerald-400 tracking-wider">${item.smsCode || 'Waiting for code...'}</span>
                    </div>

                    ${isActive ? `
                        <div class="flex items-center justify-end space-x-2 pt-1">
                            <button onclick="manualRecheckSms('${orderId}')" class="px-3 py-1.5 bg-brandBlue-800 hover:bg-brandBlue-700 text-gray-200 border border-brandBlue-600/40 text-xs font-semibold rounded-lg transition">
                                <i class="fa-solid fa-rotate mr-1"></i> Check Status
                            </button>
                            <button onclick="cancelActiveOrder('${orderId}')" class="px-3 py-1.5 bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 text-xs font-semibold rounded-lg transition">
                                <i class="fa-solid fa-ban mr-1"></i> Cancel Order
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');

        if (window.historyTimerInterval) clearInterval(window.historyTimerInterval);
        window.historyTimerInterval = setInterval(() => {
            const timerElements = document.querySelectorAll('.order-timer');
            timerElements.forEach(el => {
                const expTime = parseInt(el.getAttribute('data-expiration'), 10);
                const remaining = Math.max(0, Math.floor((expTime - Date.now()) / 1000));
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                if (remaining <= 0) {
                    el.textContent = "Expired";
                }
            });
        }, 1000);

    } catch (err) {
        console.error("Failed to load history:", err);
        historyGrid.innerHTML = `<p class="text-sm text-red-400 text-center py-6">Failed to load history records.</p>`;
    }
}

      document.addEventListener('DOMContentLoaded', () => {
        fetchUserProfile();
        fetchServices();

        const serviceSearchInput = document.getElementById('service-search-input');
        if (serviceSearchInput) {
          serviceSearchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            if (!term) {
              renderServices(services);
              return;
            }
            const filtered = services.filter(s => 
              (s.name && s.name.toLowerCase().includes(term)) || 
              (s.code && s.code.toLowerCase().includes(term))
            );
            renderServices(filtered);
          });
        }

        const countrySearchInput = document.getElementById('country-search-input');
        if (countrySearchInput) {
          countrySearchInput.addEventListener('input', (e) => {
            countrySearchTerm = e.target.value.toLowerCase().trim();
            if (selectedServiceCode && serviceCountriesCache[selectedServiceCode]) {
              renderCountries(serviceCountriesCache[selectedServiceCode]);
            }
          });
        }
      });

     return {
        fetchUserProfile,
        fetchServices,
        selectService,
        renderCountries,
        selectCountry,
        switchCountryPriceTierAndSelect, // <-- Map it or rename it here
        toggleCountryExpand,                                    // <-- Also make sure this is exposed if called from HTML
        buyServiceCountry
      };
    })();
  </script>

            async function safeFetch(url, options = {}) {
            const res = await fetch(url, options);
            const contentType = res.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                throw new Error("Server returned a non-JSON response or invalid content-type.");
            }
            const data = await res.json();
            return { res, data };
        }

        async function fetchUserProfile() {
            const token = localStorage.getItem('userToken');
            if (!token) return; 

            try {
                const { res, data } = await safeFetch(`${API_BASE_URL}/user-profile`, {
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Cache-Control': 'no-cache' 
                    }
                });

                if (res.status === 401) return logout(); 

                if (res.status === 403 && data.isUnverified) {
                    window.location.href = `user_create.html?verify_email=${encodeURIComponent(data.email || '')}`;
                    return;
                }

                if (data.success) {
                    const userData = data.user || data;
                    userBalance = userData.balance || 0; 
                    userBonusBalance = userData.bonusBalance || 0; 
                    localStorage.setItem('dashboard_cache', JSON.stringify({ user: userData }));
                }
            } catch (err) {
                console.error("Failed to fetch profile details:", err);
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => {
                b.classList.remove('active');
                b.classList.add('text-brand-lightText');
            });
            
            if (mode === 'activation') {
                document.getElementById('btnActivation').classList.add('active');
                document.getElementById('btnActivation').classList.remove('text-brand-lightText');
                document.getElementById('rentPeriodSection').classList.add('hidden');
            } else {
                document.getElementById('btnRent').classList.add('active');
                document.getElementById('btnRent').classList.remove('text-brand-lightText');
                document.getElementById('rentPeriodSection').classList.remove('hidden');
            }
            
            if (expandedServiceCode) {
                renderServiceAccordion();
            }
        }

        async function syncInventory() {
            const container = document.getElementById('serviceAccordionList');
            if (container && services.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 bg-white rounded-2xl border border-brand-border">
                        <div class="w-6 h-6 border-2 border-brand-blue border-t-transparent rounded-full animate-spin mb-3"></div>
                        <p class="text-[10px] text-brand-blue font-black uppercase tracking-widest">Loading Live SMSGlobe Services...</p>
                    </div>
                `;
            }

            try {
                const { data } = await safeFetch(`${API_BASE_URL}/services`);
                const serviceList = data.services || data.data || data;

                if (Array.isArray(serviceList)) {
                    services = serviceList.sort((a, b) => {
                        const codeA = (a.code || '').toLowerCase();
                        const codeB = (b.code || '').toLowerCase();
                        const indexA = PRIORITY_SERVICES.findIndex(p => p.code === codeA);
                        const indexB = PRIORITY_SERVICES.findIndex(p => p.code === codeB);

                        if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                        if (indexA !== -1) return -1;
                        if (indexB !== -1) return 1;

                        return (a.name || '').localeCompare(b.name || '');
                    });

                    renderServiceAccordion();
                    preFetchAllServiceCountries();
                }
            } catch (err) {
                console.error("Service sync failed", err);
                if (container) {
                    container.innerHTML = `<p class="text-center text-xs py-10 text-red-500 font-bold uppercase bg-white rounded-2xl border border-brand-border">Failed to load live services from backend</p>`;
                }
            }
        }

        async function preFetchAllServiceCountries() {
            services.forEach(s => {
                if (s.code && !serviceCountriesCache[s.code]) {
                    fetchCountriesForService(s.code, true);
                }
            });
        }

function renderServiceAccordion(filter = "") {
    const container = document.getElementById('serviceAccordionList');
    if (!container) return;

    const filtered = services.filter(s => (s.name || '').toLowerCase().includes(filter.toLowerCase()) || (s.code || '').toLowerCase().includes(filter.toLowerCase()));
    
    if (filtered.length === 0) {
        container.innerHTML = `<p class="text-center text-xs text-gray-400 py-10 font-bold bg-white rounded-2xl border border-brand-border">No services match your search</p>`;
        return;
    }

    container.innerHTML = filtered.map(s => {
        const isExpanded = expandedServiceCode === s.code;
        const countries = serviceCountriesCache[s.code] || [];
        
        const priorityMatch = PRIORITY_SERVICES.find(p => p.code === s.code);
        const serviceImgUrl = priorityMatch ? priorityMatch.iconUrl : `/api/service-image?id=${encodeURIComponent(s.code)}`;
        const fallbackInitials = (s.name || s.code).substring(0, 2).toUpperCase();

        return `
            <div class="bg-white border border-brand-border rounded-2xl overflow-hidden transition-all shadow-sm">
                <div onclick="SMSGlobeApp.toggleServiceAccordion('${s.code}')" class="px-4 sm:px-5 py-4 flex items-center justify-between cursor-pointer hover:bg-brand-background/50 transition-colors gap-2">
                    <div class="flex items-center gap-3 min-w-0">
                       <!-- Responsive wrapper with flex-shrink-0 to prevent icon crushing on mobile -->
                       <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gray-50 border border-gray-100 flex-shrink-0 flex items-center justify-center overflow-hidden p-1.5 shadow-2xs">
                          <img src="${serviceImgUrl}" alt="${s.name || s.code}" loading="lazy" class="w-full h-full object-contain block" onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';">
                          <span style="display: none;" class="items-center justify-center w-full h-full text-[10px] font-bold text-brand-darkText bg-brand-blue/10">${fallbackInitials}</span>
                       </div>
                       <div class="min-w-0">
                            <span class="text-xs sm:text-sm font-bold text-brand-darkText block truncate">${s.name || s.code}</span>
                            <span class="text-[9px] sm:text-[10px] text-brand-lightText uppercase tracking-wider">Code: ${s.code}</span>
                       </div>
                    </div>
                    <button class="text-xs font-bold text-brand-midText flex items-center gap-1 px-2.5 sm:px-3 py-1.5 rounded-lg border border-brand-border bg-white flex-shrink-0">
                        <span class="hidden sm:inline">${isExpanded ? 'Collapse' : 'Select Country'}</span>
                        <span class="sm:hidden">${isExpanded ? 'Close' : 'Select'}</span>
                        <svg class="w-3.5 h-3.5 transition-transform ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                </div>

                ${isExpanded ? `
                    <div class="border-t border-brand-border bg-brand-background/30 p-3 sm:p-4 space-y-3">
                        <div class="relative mb-3">
                            <input type="text" oninput="SMSGlobeApp.filterCountriesForService('${s.code}', this.value)" placeholder="Search country inventory..." 
                                   class="text-xs bg-white border border-brand-border rounded-lg px-3 py-2 focus:outline-none focus:border-brand-blue w-full shadow-sm">
                        </div>
                        <div id="countriesList_${s.code}" class="space-y-2">
                            ${renderCountriesListHtml(s.code, countries)}
                        </div>
                    </div>
                ` : ''}
            </div>
        `;
    }).join('');
}
      function renderCountriesListHtml(serviceCode, countriesList) {
            if (!countriesList || countriesList.length === 0) {
                return `
                    <div class="flex flex-col items-center justify-center py-6 bg-white rounded-xl border border-brand-border">
                        <div class="w-5 h-5 border-2 border-brand-blue border-t-transparent rounded-full animate-spin mb-2"></div>
                        <p class="text-[10px] text-brand-blue font-bold uppercase">Fetching Live Country Tiers & Pricing...</p>
                    </div>
                `;
            }

            let multiplier = 1;
            if (currentMode === 'rent') {
                const select = document.getElementById('rentalPeriod');
                if (select) {
                    multiplier = parseFloat(select.options[select.selectedIndex]?.getAttribute('data-multi')) || 1;
                }
            }

            return countriesList.map(c => {
                // c.availablePrices now contains the pre-converted NGN amounts from the backend
                const options = c.availablePrices || [{ amount: c.priceAmount, rank: c.rank, stock: c.stock, providerId: c.providerId }];
                const selectedIdx = c.selectedPriceIndex || 0;
                const activeTier = options[selectedIdx] || options[0];

                // Since backend already converts USD to NGN (1400 rate), we use activeTier.amount directly multiplied by rent multiplier if applicable
                const finalDisplayPrice = Number(activeTier.amount || 0) * multiplier;
                const formattedPriceString = finalDisplayPrice.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                const stockStatus = activeTier.stock || c.stock || 'In Stock';
                const countryId = c.countryId;
                const flagCode = countryId.toString().toLowerCase();
                const countryName = c.countryName;
                const rankLabel = activeTier.rank || 'Silver';
                const providerId = activeTier.providerId || c.providerId || '';
                const rankBadgeClass = rankLabel.toLowerCase().includes('silver') ? 'bg-gray-100 text-gray-700 border-gray-200' : 'bg-amber-50 text-amber-700 border-amber-200';

                return `
                    <div class="bg-white border border-brand-border p-3 rounded-xl flex items-center justify-between hover:border-brand-blue/50 transition-all">
                        <!-- Left Side: Flag & Name -->
                        <div class="flex items-center gap-3">
                            <img src="https://flagcdn.com/w40/${flagCode}.png" class="w-6 h-auto rounded-sm border border-gray-200" onerror="this.style.display='none'">
                            <div>
                                <div class="flex items-center gap-2">
                                    <p class="text-xs font-bold text-brand-darkText">${countryName}</p>
                                    <span class="text-[8px] font-semibold px-1.5 py-0.5 rounded border ${rankBadgeClass} uppercase">${rankLabel}</span>
                                </div>
                                <span class="text-[9px] text-green-600 font-bold uppercase">● Stock: ${stockStatus}</span>
                            </div>
                        </div>

                        <!-- Middle Space: Shuffle / Alternate Tier Button -->
                        <div class="flex items-center">
                            ${options.length > 1 ? `
                                <button onclick="SMSGlobeApp.shuffleCountryPriceTier('${serviceCode}', '${countryId}', this)" 
                                        title="Shuffle / Cycle alternative price tier"
                                        class="p-2 text-gray-400 hover:text-brand-blue bg-gray-50 hover:bg-brand-blue/10 rounded-lg transition-all border border-gray-200 flex items-center justify-center">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                    </svg>
                                </button>
                            ` : ''}
                        </div>

                        <!-- Right Side: Price & Action -->
                        <div class="flex items-center gap-3">
                            <div class="flex flex-col items-end">
                                <span class="text-xs font-black text-brand-blue">₦${formattedPriceString}</span>
                                ${options.length > 1 ? `
                                    <select onchange="SMSGlobeApp.switchCountryPriceTier('${serviceCode}', '${countryId}', this.value)" class="text-[9px] text-gray-500 bg-gray-50 border border-gray-200 rounded px-1 py-0.5 mt-0.5 focus:outline-none">
                                        ${options.map((opt, idx) => `
                                            <option value="${idx}" ${idx === selectedIdx ? 'selected' : ''}>
                                                ${opt.rank || 'Tier'} - ₦${(Number(opt.amount) * multiplier).toLocaleString()} (${opt.stock || 'In Stock'})
                                            </option>
                                        `).join('')}
                                    </select>
                                ` : ''}
                            </div>
                            <!-- Pass providerId safely into the purchase call -->
                            <button onclick="SMSGlobeApp.buyServiceCountry('${serviceCode}', '${countryId}', ${finalDisplayPrice}, '${rankLabel}', '${providerId}')" 
                                    class="px-4 py-2 bg-brand-blue text-white rounded-lg text-xs font-bold hover:bg-brand-blue/90 active:scale-95 transition-all">
                                Buy Number
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function toggleServiceAccordion(code) {
            if (expandedServiceCode === code) {
                expandedServiceCode = null;
            } else {
                expandedServiceCode = code;
                if (!serviceCountriesCache[code]) {
                    await fetchCountriesForService(code);
                }
            }
            renderServiceAccordion(document.getElementById('serviceSearchInput')?.value || '');
        }

        async function fetchCountriesForService(serviceCode, isBackground = false) {
            if (!serviceCode || serviceCode === 'undefined' || serviceCode === 'null') return;

            try {
                const { data: result } = await safeFetch(`${API_BASE_URL}/countries?service=${encodeURIComponent(serviceCode)}`);
                let list = [];
                const data = result.countries || result.data || result;

                const parseItems = (rawInput) => {
                    if (Array.isArray(rawInput)) return rawInput;
                    if (typeof rawInput === 'object' && rawInput !== null) {
                        return Object.entries(rawInput).map(([k, v]) => ({ countryId: k, ...v }));
                    }
                    return [];
                };

                list = parseItems(data);

                const countryMap = {};
                list.forEach(item => {
                    const cId = String(item.countryId || item.id || item.code || '');
                    if (!cId) return;

                    const cName = item.countryName || item.name || `Country ${cId}`;
                    const rawPrice = item.price?.amount || item.price || item.sellingPrice || 1400;
                    const rank = item.rank || 'Silver';
                    const stock = item.stock || item.count || 'In Stock';

                    if (!countryMap[cId]) {
                        countryMap[cId] = {
                            countryId: cId,
                            countryName: cName,
                            availablePrices: []
                        };
                    }

                    countryMap[cId].availablePrices.push({
                        amount: Number(rawPrice),
                        rank: rank,
                        stock: stock
                    });
                });

                // Post-process countries: sort options ascending so index 0 is always the absolute lowest price
                const processedCountries = Object.values(countryMap).map(country => {
                    country.availablePrices.sort((a, b) => a.amount - b.amount);
                    return {
                        ...country,
                        selectedPriceIndex: 0 
                    };
                });

                // SORT ENTIRE COUNTRIES LIST BY LOWEST PRICE ASCENDING (Lowest price starting from bottom up / top)
                processedCountries.sort((a, b) => {
                    const lowestA = a.availablePrices[0]?.amount || 0;
                    const lowestB = b.availablePrices[0]?.amount || 0;
                    return lowestA - lowestB;
                });

                serviceCountriesCache[serviceCode] = processedCountries;
            } catch (err) {
                console.error("Failed to fetch countries for service:", err);
                if (!isBackground) {
                    serviceCountriesCache[serviceCode] = [];
                }
            }

            if (!isBackground && expandedServiceCode === serviceCode) {
                renderServiceAccordion(document.getElementById('serviceSearchInput')?.value || '');
            }
        }

        function switchCountryPriceTier(serviceCode, countryId, priceIndex) {
            const countries = serviceCountriesCache[serviceCode];
            if (!countries) return;

            const country = countries.find(c => String(c.countryId) === String(countryId));
            if (country) {
                country.selectedPriceIndex = parseInt(priceIndex, 10);
                const query = document.getElementById('serviceSearchInput')?.value || '';
                const listContainer = document.getElementById(`countriesList_${serviceCode}`);
                if (listContainer) {
                    listContainer.innerHTML = renderCountriesListHtml(serviceCode, countries.filter(c => (c.countryName || '').toLowerCase().includes(query.toLowerCase())));
                }
            }
        }

        // Shuffle action button helper to cycle through available price tiers for a specific country
        function shuffleCountryPriceTier(serviceCode, countryId, buttonElement) {
            const countries = serviceCountriesCache[serviceCode];
            if (!countries) return;

            const country = countries.find(c => String(c.countryId) === String(countryId));
            if (!country || !country.availablePrices || country.availablePrices.length <= 1) return;

            // Visual spin feedback
            const svgIcon = buttonElement.querySelector('svg');
            if (svgIcon) svgIcon.classList.add('animate-spin');

            setTimeout(() => {
                if (svgIcon) svgIcon.classList.remove('animate-spin');
                
                // Cycle to next price tier index
                country.selectedPriceIndex = (country.selectedPriceIndex + 1) % country.availablePrices.length;
                
                const query = document.getElementById('serviceSearchInput')?.value || '';
                const listContainer = document.getElementById(`countriesList_${serviceCode}`);
                if (listContainer) {
                    listContainer.innerHTML = renderCountriesListHtml(serviceCode, countries.filter(c => (c.countryName || '').toLowerCase().includes(query.toLowerCase())));
                }
            }, 300);
        }

        function filterCountriesForService(serviceCode, query) {
            const allCountries = serviceCountriesCache[serviceCode] || [];
            const filtered = allCountries.filter(c => (c.countryName || '').toLowerCase().includes(query.toLowerCase()));
            const listContainer = document.getElementById(`countriesList_${serviceCode}`);
            if (listContainer) {
                listContainer.innerHTML = renderCountriesListHtml(serviceCode, filtered);
            }
        }

      async function buyServiceCountry(serviceCode, countryId, price, rank, providerId = '') {
            const token = localStorage.getItem('userToken');
            if (!token) {
                Swal.fire({ title: 'Login Required', icon: 'warning', text: 'Please log in to purchase numbers.' });
                return;
            }

            if (userBalance < price) {
                Swal.fire('Insufficient Funds', `You need ₦${price.toLocaleString()} to purchase this option. Please fund your wallet.`, 'error');
                return;
            }

            const serviceObj = services.find(s => s.code === serviceCode);
            const countriesList = serviceCountriesCache[serviceCode] || [];
            const countryObj = countriesList.find(c => String(c.countryId) === String(countryId));

            const confirmed = await Swal.fire({
                title: 'Confirm Live Purchase',
                text: `Get ${serviceObj?.name || serviceCode} (${rank} Tier) in ${countryObj?.countryName || 'Selected Country'} for ₦${price.toLocaleString()}?`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#0F54C6',
                confirmButtonText: 'Proceed Order'
            });

            if (!confirmed.isConfirmed) return;

            const payload = {
                serviceCode: serviceCode,
                countryId: countryId,
                providerId: providerId, // Crucial for routing purchase to the correct low-cost provider
                planAmount: price,
                rank: (rank || 'silver').toLowerCase(),
                metadata: {
                    serviceType: 'virtual_number',
                    serviceName: serviceObj?.name || serviceCode,
                    countryCode: countryId,
                    provider: 'smsbower'
                }
            };

            try {
                const { data: res } = await safeFetch(`${API_BASE_URL}/purchase-with-wallet`, { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });
                
                if (res.success) {
                    const realMobileNumber = res.order?.mobileNumber || res.mobileNumber;

                    document.querySelector('main')?.classList.add('hidden');
                    document.getElementById('activationPanel')?.classList.remove('hidden'); 
                    document.getElementById('displayPurchasedNumber').innerText = realMobileNumber;
                    
                    startSmsPolling(res.order?._id || res.orderId);
                    
                    Swal.fire({
                        title: 'Order Dispatched!',
                        text: 'Waiting for live SMS verification code...',
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false
                    });
                } else { 
                    Swal.fire('Order Failed', res.message || "Could not process purchase from provider.", 'error');
                }
            } catch (err) { 
                console.error("Purchase Error:", err);
                Swal.fire('Network Error', 'Check your connection and try again.', 'error');
            }
        }
        
        function copyNumber() {
            const num = document.getElementById('displayPurchasedNumber')?.innerText || '';
            navigator.clipboard.writeText(num);
            Swal.fire({ title: 'Copied!', toast: true, position: 'top-end', showConfirmButton: false, timer: 1000, icon: 'success' });
        }

        function startSmsPolling(orderId) {
            if (pollInterval) clearInterval(pollInterval);

            let attempts = 0;
            const maxAttempts = 75;

            pollInterval = setInterval(async () => {
                attempts++;
                if (attempts >= maxAttempts) {
                    clearInterval(pollInterval);
                    Swal.fire('Polling Timeout', 'Did not receive verification code in time. Please check your active orders list.', 'info');
                    return;
                }

                try {
                    const { data } = await safeFetch(`${API_BASE_URL}/order-details?id=${orderId}`, {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('userToken')}` }
                    });
                    
                    if (data.success && data.order && data.order.smsCode) {
                        clearInterval(pollInterval);
                        const codeDigits = data.order.smsCode.split('');
                        const container = document.getElementById('smsCodeContainer');
                        
                        if (container) {
                            container.innerHTML = codeDigits.map(d => `
                                <div class="w-12 h-16 bg-brand-blue text-white rounded-2xl flex items-center justify-center text-2xl font-black shadow-lg shadow-brand-blue/35 border-none animate-bounce">
                                    ${d}
                                </div>
                            `).join('');
                        }
                        
                        if (document.getElementById('fullSmsText')) {
                            document.getElementById('fullSmsText').innerText = data.order.fullMessage || "Code received successfully.";
                        }
                        
                        Swal.fire({
                            title: 'SMS Code Received!',
                            text: `Verification Code: ${data.order.smsCode}`,
                            icon: 'success',
                            confirmButtonColor: '#0F54C6'
                        });
                    }
                } catch (err) {
                    console.error("Polling error:", err);
                }
            }, 4000);
        }

        function logout() {
            localStorage.removeItem('userToken');
            localStorage.removeItem('dashboard_cache');
            window.location.href = 'user_login.html';
        }

        function toggleSidebar() {
            document.getElementById('sidebar')?.classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay')?.classList.toggle('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('openSidebar')?.addEventListener('click', toggleSidebar);
            document.getElementById('closeSidebar')?.addEventListener('click', toggleSidebar);
            
            fetchUserProfile();
            syncInventory(); 

            setInterval(syncInventory, 60000);
        });

        return {
            setMode,
            toggleServiceAccordion,
            fetchCountriesForService,
            switchCountryPriceTier,
            shuffleCountryPriceTier,
            filterCountriesForService,
            buyServiceCountry,
            copyNumber,
            logout,
            toggleSidebar
        };
    })();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMSGlobe Admin - eSIM Refills</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/syKFaNI.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (!localStorage.getItem('smsglobe_admin_token')) {
            window.location.href = 'sms_login.html';
        }

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#0F54C6',
                            orange: '#F9861E',
                            darkText: '#101828',
                            midText: '#344054',
                            lightText: '#667085',
                            background: '#F0F5FE',
                            border: '#EAECF0',
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                },
            },
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F0F5FE; font-size: 14px; }
        .sidebar-transition { transition: transform 0.3s ease-in-out; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen font-sans text-brand-darkText">

    <div class="lg:hidden flex items-center justify-between bg-white px-4 py-3 border-b border-brand-border sticky top-0 z-[60]">
        <img src="https://imgur.com/8YeZgfx.png" alt="Logo" class="h-6">
        <button onclick="toggleSidebar()" class="p-2 text-brand-midText hover:bg-brand-background rounded-lg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
            </svg>
        </button>
    </div>

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-[70] hidden lg:hidden backdrop-blur-sm"></div>

    <div class="flex">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-[80] w-64 bg-white border-r border-brand-border transform -translate-x-full lg:translate-x-0 sidebar-transition lg:static lg:block min-h-screen">
            <div class="flex flex-col h-full">
                <div class="p-5 flex-1 overflow-y-auto pt-20 lg:pt-5">
                    <img src="https://imgur.com/8YeZgfx.png" alt="SMSGlobe" class="h-9 mb-8 hidden lg:block">
                    <nav class="space-y-1">
                        <a href="sms_dashboard.html" class="flex items-center gap-3 px-3 py-2.5 text-brand-lightText hover:bg-brand-background hover:text-brand-blue rounded-xl font-medium transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                            Dashboard
                        </a>
                        <a href="esim_refills.html" class="flex items-center gap-3 px-3 py-2.5 bg-brand-background text-brand-blue rounded-xl font-bold transition-all shadow-sm">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                            eSIM Refills
                        </a>
                          <a href="esims_activation.html" class="flex items-center gap-3 px-3 py-2.5 text-brand-lightText hover:bg-brand-background hover:text-brand-blue rounded-xl font-medium transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                            eSIM Activations
                        </a>
                        <a href="sms_users.html" class="flex items-center gap-3 px-3 py-2.5 text-brand-lightText hover:bg-brand-background hover:text-brand-blue rounded-xl font-medium transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                            Users
                        </a>
                          <a href="sms_vpn.html" class="flex items-center gap-3 px-3 py-2.5 text-brand-lightText hover:bg-brand-background hover:text-brand-blue rounded-xl font-medium transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                            VPN
                        </a>
                         <a href="sms_proxy.html" class="flex items-center gap-3 px-3 py-2.5 text-brand-lightText hover:bg-brand-background hover:text-brand-blue rounded-xl font-medium transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                           Proxy Nodes
                        </a>
                        <a href="transaction_history.html" class="flex items-center gap-3 px-3 py-2.5 text-brand-lightText hover:bg-brand-background hover:text-brand-blue rounded-xl font-medium transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                            History
                        </a>
                    </nav>
                </div>
                <div class="p-5 border-t border-brand-border bg-gray-50/50">
                    <button onclick="logout()" class="flex items-center gap-3 px-3 py-2.5 w-full text-red-500 hover:bg-red-50 rounded-xl font-bold transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                        Sign Out
                    </button>
                </div>
            </div>
        </aside>

        <main class="flex-1 p-3 sm:p-6 lg:p-10 max-w-7xl mx-auto w-full overflow-hidden">
            <header class="flex flex-col md:flex-row md:items-center md:justify-between mb-6 gap-4 px-1">
                <div>
                    <h2 class="text-xl sm:text-2xl font-bold tracking-tight">eSIM Refill Management</h2>
                    <p class="text-brand-lightText text-xs sm:text-sm">Process paid refills and update confirmation numbers</p>
                </div>
                <button onclick="fetchRefills()" class="bg-brand-blue text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg hover:bg-blue-700 transition-all flex items-center gap-2 w-fit">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    Refresh List
                </button>
            </header>

            <div class="bg-white rounded-xl border border-brand-border shadow-sm overflow-hidden">
                <div class="overflow-x-auto no-scrollbar">
                    <table class="w-full text-left text-[11px] sm:text-sm whitespace-nowrap">
                        <thead class="bg-gray-50 text-brand-lightText uppercase text-[9px] sm:text-[11px] border-b border-brand-border">
                            <tr>
                                <th class="px-4 py-4 font-bold">Transaction</th>
                                <th class="px-4 py-4 font-bold">User</th>
                                <th class="px-4 py-4 font-bold">Details</th>
                                <th class="px-4 py-4 font-bold text-center">Amount</th>
                                <th class="px-4 py-4 font-bold">Status</th>
                                <th class="px-4 py-4 font-bold text-right">Process Refill</th>
                            </tr>
                        </thead>
                        <tbody id="refills-body" class="divide-y divide-gray-100">
                            <tr>
                                <td colspan="6" class="px-6 py-12 text-center text-brand-lightText italic">
                                    Fetching refill requests...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

   <div id="manageModal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl">
        <div class="p-5 border-b border-brand-border flex justify-between items-center bg-gray-50 rounded-t-2xl">
            <h3 class="font-bold text-brand-darkText">Process Refill</h3>
            <button onclick="closeModal('manageModal')" class="text-gray-400 hover:text-brand-darkText">✕</button>
        </div>
        <div class="p-6 space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-brand-lightText mb-1 uppercase">Confirmation Number / PIN</label>
                <input type="text" id="modalConfNumber" placeholder="Enter activation code..." 
                       class="w-full border border-brand-border rounded-xl p-3 text-sm focus:ring-2 focus:ring-brand-blue outline-none shadow-sm">
            </div>
            <input type="hidden" id="activeTid">
            <button id="modalSubmitBtn" onclick="confirmProcessRefill()" 
                    class="w-full bg-green-600 text-white py-3.5 rounded-xl font-bold hover:bg-green-700 transition-all shadow-lg">
                Complete Order
            </button>
        </div>
    </div>
</div>

<div id="detailModal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
        <div class="p-5 border-b border-brand-border flex justify-between items-center bg-brand-blue text-white">
            <h3 class="font-bold">Order Specification</h3>
            <button onclick="closeModal('detailModal')" class="text-white/80 hover:text-white">✕</button>
        </div>
        <div id="detailContent" class="p-6 space-y-4 max-h-[70vh] overflow-y-auto no-scrollbar text-sm">
            </div>
        <div class="p-4 bg-gray-50 border-t border-brand-border text-right">
            <button onclick="closeModal('detailModal')" class="px-6 py-2 bg-white border border-brand-border rounded-lg font-bold text-xs">Close</button>
        </div>
    </div>
</div>

<script>
    // --- SIDEBAR LOGIC ---
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
    }

    // --- FETCH & RENDER REFILLS ---
    async function fetchRefills() {
        const token = localStorage.getItem('smsglobe_admin_token');
        const tbody = document.getElementById('refills-body');

        try {
            const response = await fetch('/api/esim-refills', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();

            if (data.success && data.refills.length > 0) {
                tbody.innerHTML = data.refills.map(refill => {
                    const status = (refill.status || 'pending').toLowerCase();
                    const tid = refill.paymentReference || 'N/A';
                    
                    // Prepare data for the View Modal
                    const refillData = JSON.stringify(refill).replace(/'/g, "&apos;");

                    // Handle Currency & Amount Formatting
                    let numericAmount = 0;
                    if (refill.amount !== undefined && refill.amount !== null) {
                        numericAmount = parseFloat(String(refill.amount).replace(/[₦,]/g, '')) || 0;
                    } else if (refill.amountNGN) {
                        numericAmount = parseFloat(String(refill.amountNGN).replace(/[₦,]/g, '')) || 0;
                    }
                    const displayAmount = numericAmount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    const currencySymbol = (refill.currency === 'NGN' || !refill.currency) ? '₦' : refill.currency;

                    // Action Area Logic (Manage + View)
                    let actionButtons = `
                        <button onclick='viewOrderDetails(${refillData})' 
                                class="flex items-center gap-1.5 px-3 py-1.5 bg-gray-50 text-brand-midText border border-brand-border rounded-lg text-[10px] font-bold hover:bg-gray-100 transition-all">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            View
                        </button>
                    `;

                    if (['pending', 'successful', 'processing'].includes(status)) {
                        actionButtons += `
                            <button onclick="openManageModal('${tid}')" 
                                    class="px-4 py-1.5 bg-brand-blue text-white rounded-lg text-[10px] font-bold hover:bg-blue-700 transition-all shadow-sm">
                                Manage
                            </button>`;
                    } else if (status === 'completed') {
                        actionButtons += `
                            <div class="flex items-center gap-1 text-green-600 font-bold text-[10px] px-2">
                                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                                Done
                            </div>`;
                    }

                    return `
                        <tr class="hover:bg-gray-50/50 transition-colors">
                            <td class="px-4 py-4">
                                <div class="font-bold text-brand-darkText">#${tid.slice(-8)}</div>
                                <div class="text-[9px] text-brand-lightText">${new Date(refill.createdAt).toLocaleDateString()}</div>
                            </td>
                            <td class="px-4 py-4">
                                <div class="font-medium text-[12px]">${refill.userEmail}</div>
                            </td>
                            <td class="px-4 py-4">
                                <div class="font-bold text-brand-orange uppercase text-[10px]">${refill.nodeName || refill.carrier || 'eSIM'}</div>
                                <div class="text-[10px] font-mono bg-gray-100 px-1.5 py-0.5 rounded inline-block mt-1">
                                    ${refill.targetNumber || refill.esimIdentifier || 'N/A'}
                                </div>
                            </td>
                            <td class="px-4 py-4 text-center font-bold text-brand-blue">
                                ${currencySymbol} ${displayAmount}
                            </td>
                            <td class="px-4 py-4">
                                <span class="px-2 py-0.5 rounded-full text-[9px] font-bold uppercase ${getStatusClass(refill.status)}">
                                    ${refill.status}
                                </span>
                            </td>
                            <td class="px-4 py-4">
                                <div class="flex items-center justify-end gap-2">${actionButtons}</div>
                            </td>
                        </tr>`;
                }).join('');
            } else {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-brand-lightText italic">No requests found.</td></tr>`;
            }
        } catch (err) {
            console.error("Fetch error:", err);
            tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-red-500 font-bold">Error loading data.</td></tr>`;
        }
    }

    // --- MODAL CONTROLS ---
    function openManageModal(tid) {
        document.getElementById('activeTid').value = tid;
        document.getElementById('modalConfNumber').value = '';
        document.getElementById('manageModal').classList.remove('hidden');
    }

    function closeModal(id) {
        document.getElementById(id).classList.add('hidden');
    }

    function viewOrderDetails(order) {
        const container = document.getElementById('detailContent');
        const date = new Date(order.createdAt).toLocaleString();
        
        container.innerHTML = `
            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-2 bg-blue-50 p-3 rounded-lg border border-blue-100">
                    <p class="text-[10px] text-blue-600 font-bold uppercase">Transaction ID</p>
                    <p class="font-mono font-bold text-brand-darkText break-all">${order.paymentReference}</p>
                </div>
                <div>
                    <p class="text-[10px] text-brand-lightText font-bold uppercase">Customer</p>
                    <p class="font-medium">${order.userEmail}</p>
                </div>
                <div>
                    <p class="text-[10px] text-brand-lightText font-bold uppercase">Date</p>
                    <p class="font-medium">${date}</p>
                </div>
                <div>
                    <p class="text-[10px] text-brand-lightText font-bold uppercase">Carrier / Node</p>
                    <p class="text-brand-orange font-bold">${order.nodeName || order.carrier || 'N/A'}</p>
                </div>
                <div>
                    <p class="text-[10px] text-brand-lightText font-bold uppercase">Target eSIM/Number</p>
                    <p class="font-mono font-bold text-brand-blue">${order.targetNumber || order.esimIdentifier || 'N/A'}</p>
                </div>
                <div class="col-span-2 border-t pt-3">
                    <p class="text-[10px] text-brand-lightText font-bold uppercase mb-2">Refill Summary</p>
                    <div class="bg-gray-50 p-3 rounded-xl border border-dashed border-brand-border">
                        <div class="flex justify-between mb-1">
                            <span>Amount Paid:</span>
                            <span class="font-bold">₦${(order.amount || order.amountNGN || 0).toLocaleString()}</span>
                        </div>
                        <div class="flex justify-between text-[11px] text-brand-lightText">
                            <span>Order Status:</span>
                            <span class="uppercase font-bold">${order.status}</span>
                        </div>
                    </div>
                </div>
                ${order.confirmationNumber ? `
                <div class="col-span-2 bg-green-50 p-3 rounded-lg border border-green-200">
                    <p class="text-[10px] text-green-600 font-bold uppercase">Applied Code / Reference</p>
                    <p class="font-mono font-bold text-green-700">${order.confirmationNumber}</p>
                </div>` : ''}
            </div>
        `;
        document.getElementById('detailModal').classList.remove('hidden');
    }

    // --- PROCESSING LOGIC ---
    async function confirmProcessRefill() {
        const tid = document.getElementById('activeTid').value;
        const confirmationNumber = document.getElementById('modalConfNumber').value.trim();
        const btn = document.getElementById('modalSubmitBtn');

        if (!confirmationNumber) {
            alert("Please enter the confirmation/activation number.");
            return;
        }

        const originalText = btn.innerText;
        btn.disabled = true;
        btn.innerText = "Processing...";
        btn.classList.add('opacity-50');

        const token = localStorage.getItem('smsglobe_admin_token');

        try {
            const response = await fetch('/api/update-esim-status', {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ tid, confirmationNumber })
            });

            const data = await response.json();

            if (data.success) {
                closeModal('manageModal');
                fetchRefills();
                alert('Success: Refill completed and customer notified.');
            } else {
                alert('Failed: ' + (data.message || 'Unknown error occurred'));
                btn.disabled = false;
                btn.innerText = originalText;
                btn.classList.remove('opacity-50');
            }
        } catch (err) {
            console.error("Network Error:", err);
            alert('Network error. Please try again.');
            btn.disabled = false;
            btn.innerText = originalText;
            btn.classList.remove('opacity-50');
        }
    }

    // --- HELPERS ---
    function getStatusClass(status) {
        const s = status.toLowerCase();
        if (s === 'completed' || s === 'successful') return 'bg-green-100 text-green-700';
        if (s === 'processing') return 'bg-blue-100 text-blue-700';
        if (s === 'pending') return 'bg-orange-100 text-orange-700';
        return 'bg-gray-100 text-gray-700';
    }

    function logout() {
        localStorage.removeItem('smsglobe_admin_token');
        window.location.href = 'sms_login.html';
    }

    window.onload = fetchRefills;
</script>
</body>
</html>
